# Luxtronik SHI, optional view with HACS cards, generated by tools/gen_dashboard.py. Do not edit by hand.
# Needs the HACS card apexcharts-card (https://github.com/RomRider/apexcharts-card).
# Add this view to the dashboard next to the main one (Raw configuration editor).

title: Heat pump
views:
- type: sections
  path: luxtronik_charts
  title: Charts (HACS)
  icon: mdi:chart-line
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Temperatures
      icon: mdi:thermometer
    - type: custom:apexcharts-card
      header:
        show: true
        title: Temperatures
        show_states: true
      graph_span: 24h
      span:
        end: hour
      series:
      - entity: sensor.warmepumpe_temperature_flow
      - entity: sensor.warmepumpe_temperature_return
      - entity: sensor.warmepumpe_temperature_outside
      - entity: sensor.warmepumpe_hot_water_temperature
    - type: markdown
      content: Needs the HACS card apexcharts-card.
  - type: grid
    cards:
    - type: heading
      heading: Power and COP
      icon: mdi:flash
    - type: custom:apexcharts-card
      header:
        show: true
        title: Power and COP
        show_states: true
      graph_span: 24h
      span:
        end: hour
      series:
      - entity: sensor.warmepumpe_power_electric
      - entity: sensor.warmepumpe_power_thermal
      - entity: sensor.warmepumpe_cop_10_min
