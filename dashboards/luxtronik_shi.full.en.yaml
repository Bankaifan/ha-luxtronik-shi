      content: '**Modes.** *No influence* means the heat pump uses its own values; it does not switch anything off.
        A setpoint only applies in the mode *Setpoint*; *Offset* and *Level* correct the controller''s own target.
        The heating setpoint is a return temperature setpoint. The tile shows the controller''s effective target.'
