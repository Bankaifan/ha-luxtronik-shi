# Luxtronik SHI dashboard (full profile), generated by tools/gen_dashboard.py. Do not edit by hand.
# Entity IDs are predicted for a device named "Wärmepumpe" in English. Use the generator with --registry for your own.
# Paste into: dashboard > three dots > Edit > three dots > Raw configuration editor.

title: Heat pump
views:
- type: sections
  path: overview
  title: Overview
  icon: mdi:heat-pump
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: mdi:heat-pump
    - type: tile
      entity: binary_sensor.warmepumpe_status_connection
    - type: tile
      entity: sensor.warmepumpe_status_operating_mode
    - type: tile
      entity: sensor.warmepumpe_heating_status
    - type: tile
      entity: sensor.warmepumpe_hot_water_status
    - type: tile
      entity: sensor.warmepumpe_cooling_status
    - type: tile
      entity: sensor.warmepumpe_pool_status
    - type: tile
      entity: sensor.warmepumpe_status_error_number
    - type: tile
      entity: binary_sensor.warmepumpe_status_fault
    - type: tile
      entity: binary_sensor.warmepumpe_heating_running
    - type: tile
      entity: binary_sensor.warmepumpe_hot_water_running
    - type: tile
      entity: binary_sensor.warmepumpe_status_defrost_active
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.warmepumpe_status_operating_mode
        state: evu_lock
      card:
        type: markdown
        content: '**Utility lockout (EVU) is active.** The controller reports the operating mode "Utility lockout";
          the compressor is blocked by the grid operator signal.'
    - type: conditional
      conditions:
      - condition: state
        entity: switch.warmepumpe_heating_block
        state: 'on'
      card:
        type: markdown
        content: '**Heating is blocked** through the Smart Home Interface (switch "Wärmepumpe Heating Block"). A
          script, automation or planner set it; the heat pump does not heat until it is released.'
    - type: conditional
      conditions:
      - condition: state
        entity: switch.warmepumpe_hot_water_block
        state: 'on'
      card:
        type: markdown
        content: '**Hot water is blocked** through the Smart Home Interface (switch "Wärmepumpe Hot water Block").'
  - type: grid
    cards:
    - type: heading
      heading: Pumps
      icon: mdi:pump
    - type: tile
      entity: binary_sensor.warmepumpe_heating_pump_heating_hup
    - type: tile
      entity: binary_sensor.warmepumpe_hot_water_pump_hot_water_bup
    - type: tile
      entity: binary_sensor.warmepumpe_hot_water_pump_circulation_zip
  - type: grid
    cards:
    - type: heading
      heading: Temperatures
      icon: mdi:thermometer
    - type: tile
      entity: sensor.warmepumpe_temperature_outside
    - type: tile
      entity: sensor.warmepumpe_temperature_flow
    - type: tile
      entity: sensor.warmepumpe_temperature_return
    - type: tile
      entity: sensor.warmepumpe_temperature_flow_return_difference
    - type: tile
      entity: sensor.warmepumpe_hot_water_temperature
    - type: history-graph
      hours_to_show: 24
      entities:
      - sensor.warmepumpe_temperature_flow
      - sensor.warmepumpe_temperature_return
      - sensor.warmepumpe_temperature_outside
      - sensor.warmepumpe_hot_water_temperature
  - type: grid
    cards:
    - type: heading
      heading: Power and COP
      icon: mdi:flash
    - type: gauge
      entity: sensor.warmepumpe_power_electric
      name: Electric
      min: 0
      max: 5000
      needle: false
    - type: gauge
      entity: sensor.warmepumpe_power_thermal
      name: Thermal
      min: 0
      max: 20000
      needle: false
    - type: tile
      entity: sensor.warmepumpe_cop_10_min
    - type: history-graph
      hours_to_show: 24
      entities:
      - sensor.warmepumpe_power_electric
      - sensor.warmepumpe_power_thermal
  - type: grid
    cards:
    - type: heading
      heading: Quick view
      icon: mdi:eye
    - type: tile
      entity: switch.warmepumpe_heating_block
      tap_action:
        action: more-info
    - type: tile
      entity: switch.warmepumpe_hot_water_block
      tap_action:
        action: more-info
    - type: tile
      entity: number.warmepumpe_heating_setpoint
      state_content:
      - state
      - effective_target
    - type: tile
      entity: number.warmepumpe_hot_water_setpoint
      state_content:
      - state
      - effective_target
    - type: markdown
      content: 'Read-only overview: tapping a lock shows details and does not switch it. Controls are in the views
        *Control* and *Locks and grid*. Repairs (connection lost, values changed): [Repairs](/config/repairs).'
- type: sections
  path: energy
  title: Energy
  icon: mdi:lightning-bolt
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Energy consumed
      icon: mdi:counter
    - type: statistic
      entity: sensor.warmepumpe_energy_electric_total
      name: 'Today: Electric'
      period:
        calendar:
          period: day
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_electric_total
      name: 'This week: Electric'
      period:
        calendar:
          period: week
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_electric_total
      name: 'This month: Electric'
      period:
        calendar:
          period: month
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_thermal_total
      name: 'Today: Thermal'
      period:
        calendar:
          period: day
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_thermal_total
      name: 'This week: Thermal'
      period:
        calendar:
          period: week
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_thermal_total
      name: 'This month: Thermal'
      period:
        calendar:
          period: month
      stat_type: change
  - type: grid
    cards:
    - type: heading
      heading: Energy per day
      icon: mdi:chart-bar
    - type: statistics-graph
      entities:
      - sensor.warmepumpe_heating_energy_electric
      - sensor.warmepumpe_hot_water_energy_electric
      - sensor.warmepumpe_cooling_energy_electric
      - sensor.warmepumpe_pool_energy_electric
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
    - type: statistics-graph
      entities:
      - sensor.warmepumpe_heating_energy_thermal
      - sensor.warmepumpe_hot_water_energy_thermal
      - sensor.warmepumpe_cooling_energy_thermal
      - sensor.warmepumpe_pool_energy_thermal
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
  - type: grid
    cards:
    - type: heading
      heading: COP
      icon: mdi:speedometer
    - type: tile
      entity: sensor.warmepumpe_cop_10_min
    - type: tile
      entity: sensor.warmepumpe_heating_cop_overall
    - type: tile
      entity: sensor.warmepumpe_hot_water_cop_overall
    - type: tile
      entity: sensor.warmepumpe_cop_overall
    - type: markdown
      content: '**COP (10 min)** is the energy ratio of the last 10 minutes (thermal / electric); it is unknown
        while the compressor is stopped or just started. **COP overall** is the quotient of the energy counters
        since the counters started; it is not a seasonal performance factor.'
  - type: grid
    cards:
    - type: heading
      heading: Power and COP
      icon: mdi:flash
    - type: history-graph
      hours_to_show: 48
      entities:
      - sensor.warmepumpe_power_electric
      - sensor.warmepumpe_power_thermal
    - type: markdown
      content: '**Energy dashboard:** add the electric energy sensors as *Individual device* consumption under Settings
        > Dashboards > Energy. They are kWh counters with long-term statistics, so the cards above work without
        helpers.'
- type: sections
  path: grid
  title: Locks and grid
  icon: mdi:transmission-tower
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Locks
      icon: mdi:lock
    - type: tile
      entity: switch.warmepumpe_heating_block
    - type: tile
      entity: switch.warmepumpe_hot_water_block
    - type: tile
      entity: switch.warmepumpe_cooling_block
    - type: tile
      entity: switch.warmepumpe_pool_block
  - type: grid
    cards:
    - type: heading
      heading: Power limit
      icon: mdi:speedometer-slow
    - type: tile
      entity: select.warmepumpe_power_limit_mode
    - type: tile
      entity: number.warmepumpe_power_limit_value
  - type: grid
    cards:
    - type: heading
      heading: Hot water
      icon: mdi:water-boiler
    - type: tile
      entity: switch.warmepumpe_hot_water_circulation_pump
    - type: tile
      entity: switch.warmepumpe_hot_water_extra
    - type: tile
      entity: select.warmepumpe_hot_water_mode
    - type: tile
      entity: number.warmepumpe_hot_water_setpoint
      state_content:
      - state
      - effective_target
  - type: grid
    cards:
    - type: heading
      heading: Grid operator and PV
      icon: mdi:transmission-tower
    - type: tile
      entity: sensor.warmepumpe_status_operating_mode
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.warmepumpe_status_operating_mode
        state: evu_lock
      card:
        type: markdown
        content: '**Utility lockout (EVU) is active.** The controller reports the operating mode "Utility lockout";
          the compressor is blocked by the grid operator signal.'
    - type: tile
      entity: sensor.warmepumpe_power_electric
    - type: tile
      entity: sensor.warmepumpe_power_thermal
    - type: tile
      entity: sensor.warmepumpe_cop_10_min
    - type: markdown
      content: '**What the integration provides.** The blocks stop heating, hot water, cooling or pool heating.
        The power limit has a mode (none, soft, hard) and a value in kW. A utility lockout shows as the operating
        mode "Utility lockout". How exactly the controller reacts to each power limit mode is not verified by this
        project, see the entity reference in `docs/`. Letting the heat pump run into surplus PV power is done with
        an automation, see the *Automation* view and the blueprint "Trigger with hysteresis".'
    - type: markdown
      content: '**Planners:** if a planner such as the Heat Pump Optimizer writes blocks, modes or setpoints of
        a circuit, do not control the same circuit here at the same time. The last write wins.'
