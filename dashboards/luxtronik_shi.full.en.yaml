    - type: heading
      heading: Troubleshooting
      icon: mdi:lifebuoy
    - type: markdown
      content: |-
        1. **Entities unavailable?** The heat pump did not answer twice in a row. After 10 minutes a repair appears.
        2. **Values changed after a pause?** The controller drops everything set through the Smart Home Interface after 10 minutes without access or after a restart. See Repairs.
        3. **Bug report?** Download the diagnostics: [Integration page](/config/integrations/integration/luxtronik_shi).
        4. The **error number** is the controller's own code; the interface provides no text for it.
- type: sections
  path: automation
  title: Automation
  icon: mdi:code-braces
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Entities
      icon: mdi:code-braces
    - type: markdown
      content: Every entity below is addressed by its **entity ID**. The table is generated for this dashboard;
        keys are stable across versions, entity IDs follow the names in your registry.
    - type: markdown
      content: |-
        | Name | Key | Entity ID |
        |---|---|---|
        | Wärmepumpe Temperature: return | `return` | `sensor.warmepumpe_temperature_return` |
        | Wärmepumpe Temperature: return target | `return_target` | `sensor.warmepumpe_temperature_return_target` |
        | Wärmepumpe Temperature: return external | `return_external` | `sensor.warmepumpe_temperature_return_external` |
        | Wärmepumpe Temperature: return limit | `return_limit` | `sensor.warmepumpe_temperature_return_limit` |
        | Wärmepumpe Temperature: return target minimum | `return_min_target` | `sensor.warmepumpe_temperature_return_target_minimum` |
        | Wärmepumpe Temperature: flow | `flow` | `sensor.warmepumpe_temperature_flow` |
        | Wärmepumpe Heating Demand border | `heating_limit` | `sensor.warmepumpe_heating_demand_border` |
        | Wärmepumpe Temperature: outside | `outside` | `sensor.warmepumpe_temperature_outside` |
        | Wärmepumpe Hot water Temperature | `dhw` | `sensor.warmepumpe_hot_water_temperature` |
        | Wärmepumpe Hot water Target | `dhw_target` | `sensor.warmepumpe_hot_water_target` |
        | Wärmepumpe Hot water Maximum | `dhw_max` | `sensor.warmepumpe_hot_water_maximum` |
        | Wärmepumpe Hot water Demand border | `dhw_limit` | `sensor.warmepumpe_hot_water_demand_border` |
        | Wärmepumpe Heating Mixing circuit 1: flow | `mk1_flow` | `sensor.warmepumpe_heating_mixing_circuit_1_flow` |
        | Wärmepumpe Heating Mixing circuit 1: flow target | `mk1_flow_target` | `sensor.warmepumpe_heating_mixing_circuit_1_flow_target` |
        | Wärmepumpe Heating Mixing circuit 1: flow minimum | `mk1_flow_min` | `sensor.warmepumpe_heating_mixing_circuit_1_flow_minimum` |
        | Wärmepumpe Heating Mixing circuit 1: flow maximum | `mk1_flow_max` | `sensor.warmepumpe_heating_mixing_circuit_1_flow_maximum` |
