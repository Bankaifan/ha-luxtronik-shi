  - type: grid
    cards:
    - type: heading
      heading: Blueprints
      icon: mdi:puzzle
    - type: markdown
      content: |-
        Import a blueprint with one click, then create an automation from it (Settings > Automations > Blueprints):

        - [Block heating or hot water while a signal is on](https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=https://github.com/Bankaifan/ha-luxtronik-shi/blob/main/blueprints/automation/luxtronik_shi/block_while_signal.yaml)
        - [Trigger with hysteresis (PV surplus, price, power)](https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=https://github.com/Bankaifan/ha-luxtronik-shi/blob/main/blueprints/automation/luxtronik_shi/surplus_trigger.yaml)
        - [Notify about connection loss, error number and utility lockout](https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=https://github.com/Bankaifan/ha-luxtronik-shi/blob/main/blueprints/automation/luxtronik_shi/notify_problems.yaml)
  - type: grid
    cards:
    - type: heading
      heading: Examples
      icon: mdi:script-text
    - type: markdown
      content: Examples for your own automations. Check values and ranges for your installation first.
    - type: markdown
      content: |
        **Set the heating setpoint: the mode must be *Setpoint*, then write the value (return temperature, example value)**

        ```yaml
        actions:
          - action: select.select_option
            target:
              entity_id: select.warmepumpe_heating_mode
            data:
              option: setpoint
          - action: number.set_value
            target:
              entity_id: number.warmepumpe_heating_setpoint
            data:
              value: 30
        ```
    - type: markdown
      content: |
        **Read the effective target of the controller**

        ```yaml
        {{ state_attr('number.warmepumpe_heating_setpoint', 'effective_target') }}
        ```
    - type: markdown
      content: |
        **Notify when the heat pump is not reachable**

        ```yaml
        triggers:
          - trigger: state
            entity_id: binary_sensor.warmepumpe_status_connection
            to: "off"
            for: "00:10:00"
        actions:
          - action: notify.notify
            data:
              message: "Heat pump not reachable"
        ```
    - type: markdown
      content: 'Keep polling: never stop the integration or pause updates for more than 10 minutes, or the controller
        drops everything set through the interface.'
