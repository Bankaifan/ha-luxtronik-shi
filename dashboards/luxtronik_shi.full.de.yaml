    cards:
    - type: heading
      heading: Fehlersuche
      icon: mdi:lifebuoy
    - type: markdown
      content: |-
        1. **Entitäten nicht verfügbar?** Die Wärmepumpe hat zweimal hintereinander nicht geantwortet. Nach 10 Minuten erscheint eine Reparatur.
        2. **Werte nach einer Pause geändert?** Der Regler verwirft alles, was über das Smart Home Interface gesetzt wurde, nach 10 Minuten ohne Zugriff oder nach einem Neustart. Siehe Reparaturen.
        3. **Fehlerbericht?** Diagnose herunterladen: [Integrationsseite](/config/integrations/integration/luxtronik_shi).
        4. Die **Fehlernummer** ist der Code des Reglers; die Schnittstelle liefert keinen Text dazu.
- type: sections
  path: automation
  title: Automation
  icon: mdi:code-braces
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Entitäten
      icon: mdi:code-braces
    - type: markdown
      content: Jede Entität unten wird über ihre **Entity-ID** angesprochen. Die Tabelle ist für dieses Dashboard
        erzeugt; die Schlüssel bleiben über Versionen stabil, die Entity-IDs folgen den Namen in deiner Registry.
    - type: markdown
      content: |-
        | Name | Schlüssel | Entity-ID |
        |---|---|---|
        | Wärmepumpe Temperatur: Rücklauf | `return` | `sensor.warmepumpe_temperatur_rucklauf` |
        | Wärmepumpe Temperatur: Rücklauf-Soll | `return_target` | `sensor.warmepumpe_temperatur_rucklauf_soll` |
        | Wärmepumpe Temperatur: Rücklauf extern | `return_external` | `sensor.warmepumpe_temperatur_rucklauf_extern` |
        | Wärmepumpe Temperatur: Rücklauf-Begrenzung | `return_limit` | `sensor.warmepumpe_temperatur_rucklauf_begrenzung` |
        | Wärmepumpe Temperatur: Rücklauf-Soll Minimum | `return_min_target` | `sensor.warmepumpe_temperatur_rucklauf_soll_minimum` |
        | Wärmepumpe Temperatur: Vorlauf | `flow` | `sensor.warmepumpe_temperatur_vorlauf` |
        | Wärmepumpe Heizung Grenztemperatur | `heating_limit` | `sensor.warmepumpe_heizung_grenztemperatur` |
        | Wärmepumpe Temperatur: Außen | `outside` | `sensor.warmepumpe_temperatur_aussen` |
        | Wärmepumpe Warmwasser Temperatur | `dhw` | `sensor.warmepumpe_warmwasser_temperatur` |
        | Wärmepumpe Warmwasser Soll | `dhw_target` | `sensor.warmepumpe_warmwasser_soll` |
        | Wärmepumpe Warmwasser Minimum | `dhw_min` | `sensor.warmepumpe_warmwasser_minimum` |
        | Wärmepumpe Warmwasser Maximum | `dhw_max` | `sensor.warmepumpe_warmwasser_maximum` |
        | Wärmepumpe Warmwasser Grenztemperatur | `dhw_limit` | `sensor.warmepumpe_warmwasser_grenztemperatur` |
        | Wärmepumpe Heizung Mischkreis 1: Vorlauf | `mk1_flow` | `sensor.warmepumpe_heizung_mischkreis_1_vorlauf` |
        | Wärmepumpe Heizung Mischkreis 1: Vorlauf-Soll | `mk1_flow_target` | `sensor.warmepumpe_heizung_mischkreis_1_vorlauf_soll` |
        | Wärmepumpe Heizung Mischkreis 1: Vorlauf Minimum | `mk1_flow_min` | `sensor.warmepumpe_heizung_mischkreis_1_vorlauf_minimum` |
        | Wärmepumpe Heizung Mischkreis 1: Vorlauf Maximum | `mk1_flow_max` | `sensor.warmepumpe_heizung_mischkreis_1_vorlauf_maximum` |
        | Wärmepumpe Status: Fehlernummer | `error_number` | `sensor.warmepumpe_status_fehlernummer` |
        | Wärmepumpe Anlage: Puffertyp | `buffer_type` | `sensor.warmepumpe_anlage_puffertyp` |
        | Wärmepumpe Anlage: Schaltspielsperre | `switching_lock_minutes` | `sensor.warmepumpe_anlage_schaltspielsperre` |
        | Wärmepumpe Anlage: Mindestlaufzeit | `min_runtime_minutes` | `sensor.warmepumpe_anlage_mindestlaufzeit` |
        | Wärmepumpe Kühlen: konfiguriert | `cooling_configured` | `binary_sensor.warmepumpe_kuhlen_konfiguriert` |
        | Wärmepumpe Pool: konfiguriert | `pool_configured` | `binary_sensor.warmepumpe_pool_konfiguriert` |
        | Wärmepumpe Kühlen: freigegeben | `cooling_release` | `binary_sensor.warmepumpe_kuhlen_freigegeben` |
        | Wärmepumpe Leistung: thermisch | `compressor_thermal_power` | `sensor.warmepumpe_leistung_thermisch` |
        | Wärmepumpe Leistung: elektrisch | `electric_power` | `sensor.warmepumpe_leistung_elektrisch` |
        | Wärmepumpe Leistung: elektrisch Minimum | `electric_power_min` | `sensor.warmepumpe_leistung_elektrisch_minimum` |
        | Wärmepumpe Status: Wärmeerzeuger (Bitmaske) | `heat_generator_state` | `sensor.warmepumpe_status_warmeerzeuger_bitmaske` |
