      name: 'Diese Woche: Strom'
      period:
        calendar:
          period: week
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_electric_total
      name: 'Dieser Monat: Strom'
      period:
        calendar:
          period: month
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_thermal_total
      name: 'Heute: Wärme'
      period:
        calendar:
          period: day
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_thermal_total
      name: 'Diese Woche: Wärme'
      period:
        calendar:
          period: week
      stat_type: change
    - type: statistic
      entity: sensor.warmepumpe_energy_thermal_total
      name: 'Dieser Monat: Wärme'
      period:
        calendar:
          period: month
      stat_type: change
  - type: grid
    cards:
    - type: heading
      heading: Energie pro Tag
      icon: mdi:chart-bar
    - type: statistics-graph
      entities:
      - sensor.warmepumpe_heating_energy_electric
      - sensor.warmepumpe_hot_water_energy_electric
      - sensor.warmepumpe_cooling_energy_electric
      - sensor.warmepumpe_pool_energy_electric
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
    - type: statistics-graph
      entities:
      - sensor.warmepumpe_heating_energy_thermal
      - sensor.warmepumpe_hot_water_energy_thermal
      - sensor.warmepumpe_cooling_energy_thermal
      - sensor.warmepumpe_pool_energy_thermal
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
  - type: grid
    cards:
    - type: heading
      heading: COP
      icon: mdi:speedometer
    - type: tile
      entity: sensor.warmepumpe_cop_10_min
    - type: tile
      entity: sensor.warmepumpe_heating_cop_overall
    - type: tile
      entity: sensor.warmepumpe_hot_water_cop_overall
    - type: tile
      entity: sensor.warmepumpe_cop_overall
    - type: markdown
      content: Der **COP (10 min)** ist das Energieverhältnis der letzten 10 Minuten (thermisch / elektrisch); er
        ist unbekannt, solange der Verdichter steht oder gerade erst gestartet ist. **COP gesamt** ist der Quotient
        der Energiezähler seit Zählerbeginn; er ist keine Jahresarbeitszahl.
  - type: grid
    cards:
    - type: heading
      heading: Leistung und COP
      icon: mdi:flash
    - type: history-graph
      hours_to_show: 48
      entities:
      - sensor.warmepumpe_power_electric
      - sensor.warmepumpe_power_thermal
    - type: markdown
      content: '**Energie-Dashboard:** Die Strom-Energiesensoren unter Einstellungen > Dashboards > Energie als
        *Einzelgerät* hinzufügen. Es sind kWh-Zähler mit Langzeitstatistik, die Karten oben funktionieren daher
        ohne Hilfsentitäten.'
