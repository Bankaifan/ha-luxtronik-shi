      entity: number.warmepumpe_leistungsbegrenzung_wert
  - type: grid
    cards:
    - type: heading
      heading: Warmwasser
      icon: mdi:water-boiler
    - type: tile
      entity: switch.warmepumpe_warmwasser_zirkulationspumpe
    - type: tile
      entity: switch.warmepumpe_warmwasser_extra
    - type: tile
      entity: select.warmepumpe_warmwasser_betriebsart
