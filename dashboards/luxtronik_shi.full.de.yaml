    - type: entities
      entities:
      - entity: binary_sensor.warmepumpe_heating_available_equipped_mode_not_off
      - entity: binary_sensor.warmepumpe_hot_water_available_equipped_mode_not_off
      - entity: binary_sensor.warmepumpe_equipment_cooling
      - entity: binary_sensor.warmepumpe_equipment_pool
      - entity: binary_sensor.warmepumpe_equipment_room_controller
      - entity: binary_sensor.warmepumpe_equipment_mixing_circuit_1_heating
