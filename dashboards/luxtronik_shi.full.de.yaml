# Luxtronik-SHI-Dashboard (Profil full), erzeugt mit tools/gen_dashboard.py. Nicht von Hand ändern.
# Entity-IDs sind für ein Gerät namens "Wärmepumpe" in Deutsch vorhergesagt. Für die eigenen den Generator mit --registry nutzen.
# Einfügen unter: Dashboard > drei Punkte > Bearbeiten > drei Punkte > Rohkonfigurations-Editor.

title: Wärmepumpe
views:
- type: sections
  path: overview
  title: Übersicht
  icon: mdi:heat-pump
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: mdi:heat-pump
    - type: tile
      entity: binary_sensor.warmepumpe_status_connection
    - type: tile
      entity: sensor.warmepumpe_status_operating_mode
    - type: tile
      entity: sensor.warmepumpe_heating_status
    - type: tile
      entity: sensor.warmepumpe_hot_water_status
    - type: tile
      entity: sensor.warmepumpe_cooling_status
    - type: tile
      entity: sensor.warmepumpe_pool_status
    - type: tile
      entity: sensor.warmepumpe_status_error_number
    - type: tile
      entity: binary_sensor.warmepumpe_status_fault
    - type: tile
      entity: binary_sensor.warmepumpe_heating_running
    - type: tile
      entity: binary_sensor.warmepumpe_hot_water_running
    - type: tile
      entity: binary_sensor.warmepumpe_status_defrost_active
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.warmepumpe_status_operating_mode
        state: evu_lock
      card:
        type: markdown
        content: '**EVU-Sperre ist aktiv.** Der Regler meldet die Betriebsart "EVU-Sperre"; der Verdichter ist durch
          das Signal des Netzbetreibers gesperrt.'
    - type: conditional
      conditions:
      - condition: state
        entity: switch.warmepumpe_heating_block
        state: 'on'
      card:
        type: markdown
        content: '**Heizen ist gesperrt** über das Smart Home Interface (Schalter "Wärmepumpe Heizung Sperren").
          Ein Skript, eine Automation oder ein Planer hat ihn gesetzt; die Wärmepumpe heizt erst nach der Freigabe
          wieder.'
    - type: conditional
      conditions:
      - condition: state
        entity: switch.warmepumpe_hot_water_block
        state: 'on'
      card:
        type: markdown
        content: '**Warmwasser ist gesperrt** über das Smart Home Interface (Schalter "Wärmepumpe Warmwasser Sperren").'
  - type: grid
    cards:
    - type: heading
      heading: Pumpen
      icon: mdi:pump
    - type: tile
      entity: binary_sensor.warmepumpe_heating_pump_heating_hup
    - type: tile
      entity: binary_sensor.warmepumpe_hot_water_pump_hot_water_bup
    - type: tile
      entity: binary_sensor.warmepumpe_hot_water_pump_circulation_zip
  - type: grid
    cards:
    - type: heading
      heading: Temperaturen
      icon: mdi:thermometer
    - type: tile
      entity: sensor.warmepumpe_temperature_outside
    - type: tile
      entity: sensor.warmepumpe_temperature_flow
    - type: tile
      entity: sensor.warmepumpe_temperature_return
    - type: tile
      entity: sensor.warmepumpe_temperature_flow_return_difference
    - type: tile
      entity: sensor.warmepumpe_hot_water_temperature
    - type: history-graph
      hours_to_show: 24
      entities:
      - sensor.warmepumpe_temperature_flow
      - sensor.warmepumpe_temperature_return
      - sensor.warmepumpe_temperature_outside
      - sensor.warmepumpe_hot_water_temperature
  - type: grid
    cards:
    - type: heading
      heading: Leistung und COP
      icon: mdi:flash
    - type: gauge
      entity: sensor.warmepumpe_power_electric
      name: Strom
      min: 0
      max: 5000
      needle: false
    - type: gauge
      entity: sensor.warmepumpe_power_thermal
      name: Wärme
      min: 0
      max: 20000
      needle: false
    - type: tile
      entity: sensor.warmepumpe_cop_10_min
    - type: history-graph
      hours_to_show: 24
      entities:
      - sensor.warmepumpe_power_electric
      - sensor.warmepumpe_power_thermal
  - type: grid
    cards:
    - type: heading
      heading: Kurzüberblick
      icon: mdi:eye
    - type: tile
      entity: switch.warmepumpe_heating_block
      tap_action:
        action: more-info
    - type: tile
      entity: switch.warmepumpe_hot_water_block
      tap_action:
        action: more-info
    - type: tile
      entity: number.warmepumpe_heating_setpoint
      state_content:
      - state
      - effective_target
    - type: tile
      entity: number.warmepumpe_hot_water_setpoint
      state_content:
      - state
      - effective_target
    - type: markdown
      content: 'Reine Anzeige: Ein Tipp auf eine Sperre zeigt Details und schaltet nichts. Bedienung gibt es in
        den Ansichten *Steuerung* und *Sperren und Netz*. Reparaturen (Verbindung verloren, Werte geändert): [Reparaturen](/config/repairs).'
- type: sections
