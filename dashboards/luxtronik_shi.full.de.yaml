      - entity: binary_sensor.warmepumpe_ausstattung_warmwasser
      - entity: binary_sensor.warmepumpe_ausstattung_kuhlen
      - entity: binary_sensor.warmepumpe_ausstattung_pool
      - entity: binary_sensor.warmepumpe_ausstattung_raumregler
      - entity: binary_sensor.warmepumpe_ausstattung_mischkreis_1_heizen
      - entity: binary_sensor.warmepumpe_ausstattung_mischkreis_1_kuhlen
