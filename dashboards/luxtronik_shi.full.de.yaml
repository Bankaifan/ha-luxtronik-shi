      entity: number.warmepumpe_warmwasser_sollwert
      state_content:
      - state
      - effective_target
  - type: grid
    cards:
    - type: heading
      heading: Netzbetreiber und PV
      icon: mdi:transmission-tower
    - type: tile
      entity: sensor.warmepumpe_status_betriebsart
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.warmepumpe_status_betriebsart
        state: evu_lock
      card:
        type: markdown
        content: '**EVU-Sperre ist aktiv.** Der Regler meldet die Betriebsart "EVU-Sperre"; der Verdichter ist durch
          das Signal des Netzbetreibers gesperrt.'
    - type: tile
      entity: sensor.warmepumpe_leistung_elektrisch
    - type: tile
      entity: sensor.warmepumpe_leistung_thermisch
    - type: tile
      entity: sensor.warmepumpe_cop_10_min
    - type: markdown
      content: '**Was die Integration bietet.** Die Sperren stoppen Heizen, Warmwasser, Kühlen oder Poolheizung.
        Die Leistungsbegrenzung hat eine Betriebsart (keine, weich, hart) und einen Wert in kW. Eine EVU-Sperre
        erscheint als Betriebsart "EVU-Sperre". Wie genau der Regler auf die einzelnen Betriebsarten der Leistungsbegrenzung
        reagiert, ist in diesem Projekt nicht geprüft, siehe die Entitätenreferenz in `docs/`. PV-Überschuss nutzt
        man mit einer Automation, siehe Ansicht *Automation* und den Blueprint "Auslöser mit Hysterese".'
    - type: markdown
      content: '**Planer:** Schreibt ein Planer wie der Heat Pump Optimizer Sperren, Betriebsarten oder Sollwerte
        eines Kreises, diesen Kreis hier nicht gleichzeitig steuern. Der letzte Schreibvorgang gewinnt.'
