  - type: grid
    cards:
    - type: heading
      heading: Blueprints
      icon: mdi:puzzle
    - type: markdown
      content: |-
        Blueprint mit einem Klick importieren, dann daraus eine Automation anlegen (Einstellungen > Automationen > Blueprints):

        - [Heizen oder Warmwasser sperren, solange ein Signal an ist](https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=https://github.com/Bankaifan/ha-luxtronik-shi/blob/main/blueprints/automation/luxtronik_shi/block_while_signal.yaml)
        - [Auslöser mit Hysterese (PV-Überschuss, Preis, Leistung)](https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=https://github.com/Bankaifan/ha-luxtronik-shi/blob/main/blueprints/automation/luxtronik_shi/surplus_trigger.yaml)
        - [Benachrichtigung bei Verbindungsverlust, Fehlernummer und EVU-Sperre](https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=https://github.com/Bankaifan/ha-luxtronik-shi/blob/main/blueprints/automation/luxtronik_shi/notify_problems.yaml)
  - type: grid
    cards:
    - type: heading
      heading: Beispiele
      icon: mdi:script-text
    - type: markdown
      content: Beispiele für eigene Automationen. Werte und Bereiche vorher für die eigene Anlage prüfen.
    - type: markdown
      content: |
        **Heizungs-Sollwert setzen: Die Betriebsart muss *Sollwert* sein, dann den Wert schreiben (Rücklauftemperatur, Beispielwert)**

        ```yaml
        actions:
          - action: select.select_option
            target:
              entity_id: select.warmepumpe_heating_mode
            data:
              option: setpoint
          - action: number.set_value
            target:
              entity_id: number.warmepumpe_heating_setpoint
            data:
              value: 30
        ```
    - type: markdown
      content: |
        **Wirksamen Sollwert der Regelung lesen**

        ```yaml
        {{ state_attr('number.warmepumpe_heating_setpoint', 'effective_target') }}
        ```
    - type: markdown
      content: |
        **Benachrichtigen, wenn die Wärmepumpe nicht erreichbar ist**

        ```yaml
        triggers:
          - trigger: state
            entity_id: binary_sensor.warmepumpe_status_connection
            to: "off"
            for: "00:10:00"
        actions:
          - action: notify.notify
            data:
              message: "Heat pump not reachable"
        ```
    - type: markdown
      content: 'Weiter abfragen: Die Integration nie stoppen und Updates nie länger als 10 Minuten pausieren, sonst
        verwirft der Regler alles, was über die Schnittstelle gesetzt wurde.'
