# Luxtronik-SHI-Dashboard (Profil full), erzeugt mit tools/gen_dashboard.py. Nicht von Hand ändern.
# Entity-IDs sind für ein Gerät namens "Wärmepumpe" in Deutsch vorhergesagt. Für die eigenen den Generator mit --registry nutzen.
# Einfügen unter: Dashboard > drei Punkte > Bearbeiten > drei Punkte > Rohkonfigurations-Editor.

title: Wärmepumpe
views:
- type: sections
  path: overview
  title: Übersicht
  icon: mdi:heat-pump
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: mdi:heat-pump
    - type: tile
      entity: binary_sensor.warmepumpe_status_verbindung
    - type: tile
      entity: sensor.warmepumpe_status_betriebsart
    - type: tile
      entity: sensor.warmepumpe_heizung_status
    - type: tile
      entity: sensor.warmepumpe_warmwasser_status
    - type: tile
      entity: sensor.warmepumpe_kuhlung_status
    - type: tile
      entity: sensor.warmepumpe_pool_status
    - type: tile
      entity: sensor.warmepumpe_status_fehlernummer
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.warmepumpe_status_betriebsart
        state: evu_lock
      card:
        type: markdown
        content: '**EVU-Sperre ist aktiv.** Der Regler meldet die Betriebsart "EVU-Sperre"; der Verdichter ist durch
          das Signal des Netzbetreibers gesperrt.'
    - type: conditional
      conditions:
      - condition: state
        entity: switch.warmepumpe_heizung_sperren
        state: 'on'
      card:
        type: markdown
        content: '**Heizen ist gesperrt** über das Smart Home Interface (Schalter "Wärmepumpe Heizung Sperren").
          Ein Skript, eine Automation oder ein Planer hat ihn gesetzt; die Wärmepumpe heizt erst nach der Freigabe
          wieder.'
    - type: conditional
      conditions:
      - condition: state
        entity: switch.warmepumpe_warmwasser_sperren
        state: 'on'
      card:
        type: markdown
        content: '**Warmwasser ist gesperrt** über das Smart Home Interface (Schalter "Wärmepumpe Warmwasser Sperren").'
  - type: grid
    cards:
    - type: heading
      heading: Temperaturen
      icon: mdi:thermometer
    - type: tile
      entity: sensor.warmepumpe_temperatur_aussen
    - type: tile
      entity: sensor.warmepumpe_temperatur_vorlauf
    - type: tile
      entity: sensor.warmepumpe_temperatur_rucklauf
    - type: tile
      entity: sensor.warmepumpe_warmwasser_temperatur
    - type: history-graph
      hours_to_show: 24
      entities:
      - sensor.warmepumpe_temperatur_vorlauf
      - sensor.warmepumpe_temperatur_rucklauf
      - sensor.warmepumpe_temperatur_aussen
      - sensor.warmepumpe_warmwasser_temperatur
  - type: grid
    cards:
    - type: heading
      heading: Leistung und COP
      icon: mdi:flash
    - type: gauge
      entity: sensor.warmepumpe_leistung_elektrisch
      name: Strom
      min: 0
      max: 5000
      needle: false
    - type: gauge
      entity: sensor.warmepumpe_leistung_thermisch
      name: Wärme
      min: 0
      max: 20000
      needle: false
    - type: tile
      entity: sensor.warmepumpe_cop_10_min
    - type: history-graph
      hours_to_show: 24
      entities:
      - sensor.warmepumpe_leistung_elektrisch
      - sensor.warmepumpe_leistung_thermisch
  - type: grid
    cards:
    - type: heading
      heading: Kurzüberblick
      icon: mdi:eye
    - type: tile
      entity: switch.warmepumpe_heizung_sperren
      tap_action:
        action: more-info
    - type: tile
      entity: switch.warmepumpe_warmwasser_sperren
      tap_action:
        action: more-info
    - type: tile
      entity: number.warmepumpe_heizung_sollwert
      state_content:
      - state
      - effective_target
    - type: tile
      entity: number.warmepumpe_warmwasser_sollwert
      state_content:
      - state
      - effective_target
    - type: markdown
      content: 'Reine Anzeige: Ein Tipp auf eine Sperre zeigt Details und schaltet nichts. Bedienung gibt es in
        den Ansichten *Steuerung* und *Sperren und Netz*. Reparaturen (Verbindung verloren, Werte geändert): [Reparaturen](/config/repairs).'
- type: sections
  path: energy
  title: Energie
  icon: mdi:lightning-bolt
  max_columns: 4
  sections:
