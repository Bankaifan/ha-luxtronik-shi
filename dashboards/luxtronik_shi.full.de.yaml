      heading: Fehlersuche
      icon: mdi:lifebuoy
    - type: markdown
      content: |-
        1. **Entitäten nicht verfügbar?** Die Wärmepumpe hat zweimal hintereinander nicht geantwortet. Nach 10 Minuten erscheint eine Reparatur.
        2. **Werte nach einer Pause geändert?** Der Regler verwirft alles, was über das Smart Home Interface gesetzt wurde, nach 10 Minuten ohne Zugriff oder nach einem Neustart. Siehe Reparaturen.
        3. **Fehlerbericht?** Diagnose herunterladen: [Integrationsseite](/config/integrations/integration/luxtronik_shi).
        4. Die **Fehlernummer** ist der Code des Reglers; die Schnittstelle liefert keinen Text dazu.
- type: sections
  path: automation
  title: Automation
  icon: mdi:code-braces
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Entitäten
      icon: mdi:code-braces
    - type: markdown
      content: Jede Entität unten wird über ihre **Entity-ID** angesprochen. Die Tabelle ist für dieses Dashboard
        erzeugt; die Schlüssel bleiben über Versionen stabil, die Entity-IDs folgen den Namen in deiner Registry.
    - type: markdown
      content: |-
        | Name | Schlüssel | Entity-ID |
        |---|---|---|
        | Wärmepumpe Temperatur: Rücklauf | `return` | `sensor.warmepumpe_temperature_return` |
        | Wärmepumpe Temperatur: Rücklauf-Soll | `return_target` | `sensor.warmepumpe_temperature_return_target` |
        | Wärmepumpe Temperatur: Rücklauf extern | `return_external` | `sensor.warmepumpe_temperature_return_external` |
        | Wärmepumpe Temperatur: Rücklauf-Begrenzung | `return_limit` | `sensor.warmepumpe_temperature_return_limit` |
        | Wärmepumpe Temperatur: Rücklauf-Soll Minimum | `return_min_target` | `sensor.warmepumpe_temperature_return_target_minimum` |
        | Wärmepumpe Temperatur: Vorlauf | `flow` | `sensor.warmepumpe_temperature_flow` |
        | Wärmepumpe Heizung Anforderungsgrenze | `heating_demand_border` | `sensor.warmepumpe_heating_demand_border` |
        | Wärmepumpe Temperatur: Außen | `outside` | `sensor.warmepumpe_temperature_outside` |
        | Wärmepumpe Warmwasser Temperatur | `dhw` | `sensor.warmepumpe_hot_water_temperature` |
        | Wärmepumpe Warmwasser Soll | `dhw_target` | `sensor.warmepumpe_hot_water_target` |
        | Wärmepumpe Warmwasser Maximum | `dhw_max` | `sensor.warmepumpe_hot_water_maximum` |
        | Wärmepumpe Warmwasser Anforderungsgrenze | `dhw_demand_border` | `sensor.warmepumpe_hot_water_demand_border` |
        | Wärmepumpe Heizung Mischkreis 1: Vorlauf | `mk1_flow` | `sensor.warmepumpe_heating_mixing_circuit_1_flow` |
        | Wärmepumpe Heizung Mischkreis 1: Vorlauf-Soll | `mk1_flow_target` | `sensor.warmepumpe_heating_mixing_circuit_1_flow_target` |
        | Wärmepumpe Heizung Mischkreis 1: Vorlauf Minimum | `mk1_flow_min` | `sensor.warmepumpe_heating_mixing_circuit_1_flow_minimum` |
        | Wärmepumpe Heizung Mischkreis 1: Vorlauf Maximum | `mk1_flow_max` | `sensor.warmepumpe_heating_mixing_circuit_1_flow_maximum` |
        | Wärmepumpe Status: Fehlernummer | `error_number` | `sensor.warmepumpe_status_error_number` |
        | Wärmepumpe Anlage: Puffertyp | `buffer_type` | `sensor.warmepumpe_system_buffer_tank_type` |
        | Wärmepumpe Kühlen: konfiguriert | `cooling_configured` | `binary_sensor.warmepumpe_cooling_configured` |
        | Wärmepumpe Pool: konfiguriert | `pool_configured` | `binary_sensor.warmepumpe_pool_configured` |
        | Wärmepumpe Kühlen: freigegeben | `cooling_release` | `binary_sensor.warmepumpe_cooling_released` |
        | Wärmepumpe Leistung: thermisch | `compressor_thermal_power` | `sensor.warmepumpe_power_thermal` |
        | Wärmepumpe Leistung: elektrisch | `electric_power` | `sensor.warmepumpe_power_electric` |
        | Wärmepumpe Leistung: elektrisch Minimum | `electric_power_min` | `sensor.warmepumpe_power_electric_minimum` |
        | Wärmepumpe Status: Wärmeerzeuger (Bitmaske) | `heat_generator_state` | `sensor.warmepumpe_status_heat_generator_bit_mask` |
