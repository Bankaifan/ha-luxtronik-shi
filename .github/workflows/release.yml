name: Release

# Creates tag vX.Y.Z (or vX.Y.Z-beta.N) and a GitHub release automatically when a version bump reaches main.
# The version is taken from manifest.json, the release notes from the matching CHANGELOG section.
# Versions containing '-beta.' are published as GitHub pre-releases (HACS offers them only with "Show beta versions").
# Nothing happens if the tag already exists, so ordinary merges without a version bump are ignored.

# Runs only after the Validate workflow finished successfully for a push to main, so every release is created
# after hassfest, the HACS action and the tests have passed on exactly that commit.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Detect version bump
        id: version
        run: |
          version="$(python tools/check_version.py --version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version exists, nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check CHANGELOG
        if: steps.version.outputs.new == 'true'
        run: python tools/check_version.py "refs/tags/v${{ steps.version.outputs.version }}"
      - name: Create tag and release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python tools/check_version.py --notes > notes.md
          flags=()
          if [ "$(python tools/check_version.py --prerelease)" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" --target "$TARGET_SHA" --title "v$VERSION" --notes-file notes.md "${flags[@]}"
