name: dependabot-automerge
# No model. Trigger: workflow_run on `Validate` (not pull_request_target), because runs started by
# dependabot get no repo secrets and workflow_run always runs the default-branch version of this file.
# PR code is never checked out. Open: whether workflow_run of a dependabot-triggered run sees the
# Actions secrets; if not, add the 4 app secrets as Dependabot secrets too (see README).
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] needs repo secrets that dependabot runs lack; checks out main only, no PR code runs
    workflows: [Validate]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  dependabot:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # Only the script is checked out, from the default branch.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - id: approver
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_APP_KEY }}
      - id: author
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
      - name: Approve and auto-merge patch/minor, label majors
        env:
          APPROVER_TOKEN: ${{ steps.approver.outputs.token }}
          AUTHOR_TOKEN: ${{ steps.author.outputs.token }}
        run: |
          set -euo pipefail
          # The PR whose head is the validated commit (workflow_run.pull_requests can be empty).
          pr=$(GH_TOKEN="$AUTHOR_TOKEN" gh pr list --head "$HEAD_BRANCH" --state open --json number,headRefOid,title \
            --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\")][0] // empty")
          if [ -z "$pr" ]; then echo "no open PR with head $HEAD_SHA, nothing to do"; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          title=$(jq -r .title <<<"$pr")
          kind=$(python3 tools/dependabot_update_type.py "$title")
          echo "PR #$number: $kind"
          if [ "$kind" = "major" ]; then
            GH_TOKEN="$APPROVER_TOKEN" gh pr edit "$number" --add-label needs-human
            exit 0
          fi
          GH_TOKEN="$APPROVER_TOKEN" gh pr review "$number" --approve --body "Dependabot $kind update, Validate is green."
          GH_TOKEN="$AUTHOR_TOKEN" gh pr merge "$number" --auto --rebase
