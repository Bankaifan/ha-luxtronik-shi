name: canary
# Pipeline canary (issue #423, no model): after a merge to main that touches workflows or tools, tools/canary.py opens one
# signed haiku issue (at most one per 6 h); every 15 min the check judges the newest canary that is 45 min to 2 h old and
# opens a signed "Failing workflow: canary" issue naming the stage where the chain stopped. DRY_RUN prints, writes nothing.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/**"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the actions, write nothing"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: canary
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-issues: write
          permission-pull-requests: read
          permission-actions: read
      - name: Open the canary issue
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          GUARD_KEY: ${{ secrets.GUARD_KEY }}  # signs the issue; script step only, never a model step
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
        run: python3 tools/canary.py create
      - name: Check the newest canary
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          GUARD_KEY: ${{ secrets.GUARD_KEY }}  # signs the failure issue; script step only, never a model step
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
        run: python3 tools/canary.py check
