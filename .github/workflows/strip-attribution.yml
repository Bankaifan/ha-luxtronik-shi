name: strip-attribution
# Removes tool attribution footers (tools/attribution.py) from PR and issue bodies and saves the body only when it changed,
# so the `edited` event it causes finds nothing and stops. A script step only: the checkout is the default branch, the
# body is read through gh as text and no PR code runs. Replaces a red validate run and a model fix run (#471).
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] checks out the default branch only and never runs PR code
    types: [opened, edited]
  issues:
    types: [opened, edited]
permissions:
  contents: read
jobs:
  strip:
    if: github.event.sender.type != 'Bot' || github.event.action == 'opened'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    # A pending run is replaced by the newest one; never cancel a run that is saving a body.
    concurrency:
      group: strip-attribution-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
        run: |
          [ -n "$AUTHOR_CLIENT_ID" ] || { echo "::error::Repo variable AUTHOR_CLIENT_ID is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
      - id: author
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Strip the footer
        env:
          GH_TOKEN: ${{ steps.author.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 tools/strip_attribution.py "$NUMBER"
