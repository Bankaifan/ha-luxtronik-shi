name: template-sync
# Daily poll: report template changes as one issue when the template's x version moved
# (designs 0001 and 0011). No model. Off when the repo variable TEMPLATE_SYNC is `off`.
# TEMPLATE_SYNC_MODE `all` (default `version`) skips the version gate; so does the `force` input.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Skip the version gate (report managed changes whatever the version)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sync:
    if: (vars.TEMPLATE_SYNC || 'on') != 'off'
    # Job level on purpose: a skipped run must not take over the group.
    concurrency:
      group: template-sync
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report template changes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_FORCE: ${{ inputs.force == true }}
          SYNC_ALL: ${{ (vars.TEMPLATE_SYNC_MODE || 'version') == 'all' }}
        run: >-
          python3 -c "import os, sys; sys.path.insert(0, 'tools'); import template_sync;
          sys.exit(template_sync.main(force=os.environ['SYNC_FORCE'] == 'true',
          mode='all' if os.environ['SYNC_ALL'] == 'true' else 'version'))"
