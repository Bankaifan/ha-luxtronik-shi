name: template-sync
# Daily poll (designs 0001, 0011) and the scripted sync (design 0014). No model.
# Off when the repo variable TEMPLATE_SYNC is `off`. TEMPLATE_SYNC_APPLY `off` (default on) keeps the issue-only report.
# TEMPLATE_SYNC_MODE `all` (default) skips the version gate; so does the `force` input. `version` keeps the gate.
# build: template reads and the script from base/ (read token only); make check in work/ with no token; no push.
# publish: the only job with write tokens; git and gh only, the patch and the body are data from build.
# report: the issue flow, when TEMPLATE_SYNC_APPLY is off or build failed (red check, error in the gate or apply).
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Skip the version gate (report managed changes whatever the version)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: (vars.TEMPLATE_SYNC || 'on') != 'off' && (vars.TEMPLATE_SYNC_APPLY || 'on') != 'off'
    # Job level on purpose: a skipped run must not take over the group.
    concurrency:
      group: template-sync
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      patch: ${{ steps.collect.outputs.patch }}
      conflict: ${{ steps.collect.outputs.conflict }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: work
      - id: gate
        name: Version gate and template main SHA
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_FORCE: ${{ inputs.force == true }}
          SYNC_ALL: ${{ (vars.TEMPLATE_SYNC_MODE || 'all') == 'all' }}
        run: |
          python3 - <<'EOF'
          import os
          import sys

          sys.path.insert(0, "base/tools")
          import template_sync as ts


          def emit(run, sha=""):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"run={run}\nsha={sha}\n")


          path = "work/.agents/template.json"
          if not os.path.exists(path):
              emit("false")
              sys.exit(0)
          cfg = ts.parse_config(open(path, encoding="utf-8").read())
          if not cfg.get("synced_sha") or os.environ["GH_REPO"].lower() == cfg["template"].lower():
              emit("false")
              sys.exit(0)
          sha = ts.gh("api", f"repos/{cfg['template']}/commits/main", "--jq", ".sha").strip()
          version = ts.read_version(ts.read_template_file(cfg["template"], "VERSION", sha))
          forced = os.environ["SYNC_FORCE"] == "true" or os.environ["SYNC_ALL"] == "true"
          if not forced and not ts.needs_sync(version, cfg.get("synced_version", "")):
              emit("false")
              sys.exit(0)
          emit("true", sha)
          EOF
      - name: Install pinned tools
        if: steps.gate.outputs.run == 'true'
        env:
          EXTRA_INSTALL: ${{ vars.EXTRA_INSTALL }}
        run: bash base/tools/ci/install_tools.sh
      - name: Apply the template changes (template reads, script from base/)
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SYNC_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 base/tools/template_sync.py apply --root work --sha "$SYNC_SHA" --body-file out/pr-body.md
      - name: Checks on the result (no token in this step)
        if: steps.gate.outputs.run == 'true'
        working-directory: work
        run: make check
      - id: collect
        name: Collect the patch and the PR data
        if: steps.gate.outputs.run == 'true'
        env:
          SYNC_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          if [ ! -f out/pr-body.md ]; then
            echo "patch=false" >> "$GITHUB_OUTPUT"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title="$(git -C work log -1 --format=%s)"
          branch="$(git -C work rev-parse --abbrev-ref HEAD)"
          if ! grep -Eqx 'template-sync/[0-9]+\.[0-9]+' <<<"$branch"; then
            echo "::error::unexpected branch name from apply"
            exit 1
          fi
          git -C work format-patch -1 --stdout > out/sync.patch
          printf '%s\n' "$title" > out/pr-title.txt
          printf '%s\n' "$branch" > out/branch.txt
          conflict=false
          if [[ "$title" == *" part 1" ]]; then
            conflict=true
            printf 'Template sync %s\n' "${SYNC_SHA:0:7}" > out/issue-title.txt
            cp out/pr-body.md out/issue.md
            printf '\nTemplate-Sync: %s\n' "$SYNC_SHA" >> out/issue.md
          fi
          echo "patch=true" >> "$GITHUB_OUTPUT"
          echo "conflict=$conflict" >> "$GITHUB_OUTPUT"
      - name: Upload the patch and the PR data
        if: steps.collect.outputs.patch == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync
          path: out/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.patch == 'true'
    concurrency:
      group: template-sync
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] this job pushes the branch with the app token persisted by checkout
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync
          path: ${{ runner.temp }}/sync
      - name: Push the branch, open or edit the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SYNC_DIR: ${{ runner.temp }}/sync
        run: |
          set -euo pipefail
          branch="$(<"$SYNC_DIR/branch.txt")"
          title="$(<"$SYNC_DIR/pr-title.txt")"
          if ! grep -Eqx 'template-sync/[0-9]+\.[0-9]+' <<<"$branch"; then
            echo "::error::unexpected branch name in the artifact"
            exit 1
          fi
          git config user.name "Daniel"
          git config user.email "476059+Bankaifan@users.noreply.github.com"
          git am --no-verify "$SYNC_DIR/sync.patch"
          git push --force origin "HEAD:refs/heads/$branch"
          gh pr create --head "$branch" --title "$title" --body-file "$SYNC_DIR/pr-body.md" \
            || gh pr edit "$branch" --title "$title" --body-file "$SYNC_DIR/pr-body.md"
      - name: Open the conflict issue for the developer, once
        if: needs.build.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SYNC_DIR: ${{ runner.temp }}/sync
        run: |
          set -euo pipefail
          title="$(<"$SYNC_DIR/issue-title.txt")"
          if [ "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)" = "0" ]; then
            gh issue create --title "$title" --body-file "$SYNC_DIR/issue.md" --label agent:dev
          fi
  report:
    needs: build
    # Issue flow: TEMPLATE_SYNC_APPLY is off, or the scripted run failed (red make check, error in gate or apply).
    if: >-
      always() && (vars.TEMPLATE_SYNC || 'on') != 'off' &&
      ((vars.TEMPLATE_SYNC_APPLY || 'on') == 'off' || needs.build.result == 'failure')
    concurrency:
      group: template-sync
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report template changes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_FORCE: ${{ inputs.force == true }}
          SYNC_ALL: ${{ (vars.TEMPLATE_SYNC_MODE || 'all') == 'all' }}
        run: >-
          python3 -c "import os, sys; sys.path.insert(0, 'tools'); import template_sync;
          sys.exit(template_sync.main(force=os.environ['SYNC_FORCE'] == 'true',
          mode='all' if os.environ['SYNC_ALL'] == 'true' else 'version'))"
