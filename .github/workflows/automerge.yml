name: automerge
on:
  pull_request_review:
    types: [submitted]
  # A security-review that finishes after the approval must still be able to release the merge.
  status:  # zizmor: ignore[dangerous-triggers] runs from main, never checks out PR code, only enables auto-merge
permissions:
  contents: read
jobs:
  automerge:
    if: >-
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'status' && github.event.context == 'security-review' && github.event.state == 'success')
    # Two approvals in the same second start two runs for one PR; queue them per PR instead of racing.
    concurrency:
      group: automerge-${{ github.event.pull_request.number || github.event.sha }}
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
        run: |
          for n in AUTHOR_CLIENT_ID; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # main only: the shared approval helper (tools/approval.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      # Review event: the PR is in the payload. Status event: find the open agent PR whose head is exactly that SHA
      # and that is already approved; anything else ends quietly.
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_FROM_REVIEW: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.sha }}
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
        run: |
          if [ "$EVENT" = "pull_request_review" ]; then echo "number=$PR_FROM_REVIEW" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '[.[] | select(.state == "open" and .head.sha == "'"$SHA"'" and .user.type == "Bot" and .user.login != "dependabot[bot]")][0].number // empty')
          if [ -z "$n" ]; then echo "No open agent PR with head $SHA"; exit 0; fi
          if [ "$(python3 tools/approval.py check "$n")" != "approved" ]; then echo "PR #$n is not approved yet"; exit 0; fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
      # Design PRs (docs/design/) never auto-merge: the design reviewer approves; Daniel merges
      # (or the orchestrator when Owner decisions is empty). Repo variable DESIGN_AUTOMERGE=on (default on in the template repo itself) lifts this
      # (the design reviewer then decides Owner decisions itself; used in the template repo).
      - name: Refuse design PRs
        id: design
        if: steps.pr.outputs.number != '' && (vars.DESIGN_AUTOMERGE || (github.repository == 'Bankaifan/agent-template' && 'on' || 'off')) != 'on'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          n=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | select(.filename | startswith("docs/design/")) | .filename' | wc -l)
          if [ "$n" -gt 0 ]; then echo "design=true" >> "$GITHUB_OUTPUT"; echo "PR touches docs/design/: no auto-merge"; fi
      # A risk:security PR merges only when security-review is success for exactly the current head SHA.
      # Pending or failed is not an error: the PR waits, and the status event re-runs this workflow on success.
      - name: Wait for security-review on risk:security PRs
        id: gate
        if: steps.pr.outputs.number != '' && steps.design.outputs.design != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
        run: |
          view=$(gh pr view "$PR" --json labels,headRefOid)
          if [ "$(jq '[.labels[].name] | index("risk:security") != null' <<<"$view")" != "true" ]; then exit 0; fi
          # A security `changes` verdict for the head blocks the merge whatever the code review decision says.
          if [ "$(python3 tools/approval.py security-changes "$PR")" != "no" ]; then
            echo "wait=true" >> "$GITHUB_OUTPUT"
            echo "risk:security PR #$PR: security reviewer asked for changes (or the verdict is unreadable); not merging"
            exit 0
          fi
          sha=$(jq -r .headRefOid <<<"$view")
          state=$(gh api "repos/$GH_REPO/commits/$sha/statuses" --jq '[.[] | select(.context == "security-review")][0].state // "none"')
          if [ "$state" != "success" ]; then
            echo "wait=true" >> "$GITHUB_OUTPUT"
            echo "risk:security PR #$PR: security-review is $state for $sha; not merging yet"
          fi
      - name: Enable auto-merge (rebase, keeps Daniel as author); GitHub merges once the ruleset is satisfied
        if: steps.pr.outputs.number != '' && steps.design.outputs.design != 'true' && steps.gate.outputs.wait != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # A second run on the same PR can find the merge already queued, running or done. That is success, not a failure mail.
          if out=$(gh pr merge "$PR" --auto --rebase 2>&1); then
            echo "$out"
            exit 0
          fi
          # A failed state read is not evidence the PR is closed: it only counts when the state was read and is not OPEN.
          state=$(gh pr view "$PR" --json state --jq .state 2>/dev/null) || state=""
          if { [ -n "$state" ] && [ "$state" != "OPEN" ]; } || printf '%s\n' "$out" | grep -qiE 'Merge already in progress|already merged|not open'; then
            echo "::notice::PR #$PR is ${state:-unknown}; nothing left to enable: $out"
            exit 0
          fi
          echo "$out" >&2
          exit 1
