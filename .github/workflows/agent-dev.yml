name: agent-dev
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  dev:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:dev') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/dev') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # One run per issue; the 2-job cap is kept by the orchestrator (at most 2 open agent:dev issues).
    # At job level on purpose: a skipped run (e.g. the label event for model:sonnet) must not replace a pending real run.
    # Every label event starts a run here (GitHub cannot filter label names at workflow level); runs that are not
    # `agent:dev` or `/dev` show as skipped. That is expected, not a failure. See docs/decisions/0009-label-triggers.md.
    concurrency:
      group: agent-dev-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      MODEL: ${{ contains(github.event.issue.labels.*.name, 'model:sonnet') && 'sonnet' || 'haiku' }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
        run: |
          for n in AUTHOR_CLIENT_ID AUTHOR_BOT; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] this job pushes with the app token persisted by checkout
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "Daniel"
          git config user.email "476059+Bankaifan@users.noreply.github.com"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.x' }}
      - name: Install pinned CI tools (ruff, pytest, actionlint, zizmor)
        env:
          EXTRA_INSTALL: ${{ vars.EXTRA_INSTALL }}
        run: bash tools/ci/install_tools.sh
      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: "476059"
          bot_name: "Bankaifan"
          allowed_bots: ${{ vars.AUTHOR_BOT }}
          prompt: |
            Act as the developer described in .agents/roles/developer.md and follow AGENTS.md.
            Task: GitHub issue #${{ env.ISSUE }} in ${{ github.repository }} (read it with gh issue view).
            Create branch agent/${{ env.ISSUE }}-<slug> from main, implement, run `make check` and the tests,
            squash the branch into ONE commit authored by Daniel without a Co-authored-by trailer, push, and open a PR with
            `gh pr create` (English ASCII title, body max 5 lines, "Closes #${{ env.ISSUE }}").
            Use Read/Glob/Grep to read files, not shell reads. If a needed action is denied,
            comment on the issue/PR saying which one instead of stopping silently.
          claude_args: >-
            --model ${{ env.MODEL }}
            --max-turns 60
            --setting-sources user
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(make:*),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(actionlint:*),Bash(zizmor:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh release view:*),Bash(gh release list:*)"
      # Deterministic, inline on purpose: the agent may edit files in the checkout, never this step.
      - name: Make sure CI runs on the PR head
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pr=$(gh pr list --state open --json number,headRefName,headRefOid \
            | jq -c --arg p "agent/${ISSUE}-" '[.[] | select(.headRefName | startswith($p))] | first // empty')
          if [ -z "$pr" ]; then echo "No open PR for issue $ISSUE"; exit 0; fi
          num=$(jq -r .number <<<"$pr"); branch=$(jq -r .headRefName <<<"$pr"); sha=$(jq -r .headRefOid <<<"$pr")
          for _ in 1 2 3 4 5 6; do
            n=$(gh run list --workflow validate.yml --commit "$sha" --json databaseId --jq length)
            if [ "$n" -gt 0 ]; then echo "validate already runs for $sha"; exit 0; fi
            sleep 10
          done
          gh workflow run validate.yml --ref "$branch"
          # The agent may edit the checkout: run the helper as it is on the default branch.
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/guard"
          git archive FETCH_HEAD tools | tar -x -C "$RUNNER_TEMP/guard"
          python3 "$RUNNER_TEMP/guard/tools/agent_guard.py" label pr "$num" agent:review
      # Never end silently: no PR for the branch means a comment, needs-human and Daniel assigned.
      - name: Escalate a run that produced no PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          # The agent may edit the checkout: run the helper as it is on the default branch.
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/guard"
          git archive FETCH_HEAD tools | tar -x -C "$RUNNER_TEMP/guard"
          # Rule: the guard comes from main, this call from the PR branch. `silent` ignores extra trailing args and a
          # usage error escalates ("guard error"); only ever append args, never reorder or remove them.
          python3 "$RUNNER_TEMP/guard/tools/agent_guard.py" silent dev "$ISSUE" "$STARTED"
