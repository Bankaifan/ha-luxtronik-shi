name: agent-fix
run-name: "${{ github.event_name == 'pull_request_review' && github.event.pull_request.title || github.event_name == 'workflow_run' && github.event.workflow_run.display_title || github.event_name == 'workflow_dispatch' && format('PR #{0}', inputs.pr) || 'agent-fix' }}"
# Automatic fix round on an agent/* PR, started by
#  - the approver app requesting changes (pull_request_review), or
#  - a failed `validate` run (workflow_run), which counts as a round too.
# Both triggers run in the base repo context and get the repo secrets.
# Also started by `workflow_dispatch` with input `pr` (the status run, for a PR that conflicts with main): a conflict
# is no finding, so it starts a fix without reading or bumping the round labels.
# Rounds: labels review:1, review:2 -> fix; review:3 -> restart the issue once (restart:1), else needs-human.
# A red CI bumps the label first; the first PR-form or VERSION/CHANGELOG failure of a PR gets an uncounted fix run (formfix).
on:
  pull_request_review:
    types: [submitted]
  workflow_run:  # zizmor: ignore[dangerous-triggers] validate gate only; the job never executes PR code and checks out the PR branch only to push fixes with the app token
    workflows: [validate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the agent/* PR that conflicts with main
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       (github.event.review.state == 'changes_requested' || github.event.review.state == 'approved') &&
       startsWith(github.event.pull_request.head.ref, 'agent/') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       startsWith(github.event.workflow_run.head_branch, 'agent/') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # No concurrency group here on purpose: any review by any user would take it and could replace a pending real
    # fix run. The group lives on the `fix` job, which only starts after the approver check.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      fix: ${{ steps.round.outputs.fix }}
      pr: ${{ steps.round.outputs.pr }}
      branch: ${{ steps.round.outputs.branch }}
      model: ${{ steps.round.outputs.model }}
    env:
      EVENT: ${{ github.event_name }}
      DISPATCH_PR: ${{ inputs.pr }}
      REVIEW_PR: ${{ github.event.pull_request.number }}
      REVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      REVIEWER: ${{ github.event.review.user.login }}
      REVIEW_STATE: ${{ github.event.review.state }}
      REVIEW_COMMIT: ${{ github.event.review.commit_id }}
      APPROVER_BOT: ${{ vars.APPROVER_BOT }}
    steps:
      - name: Fail if a required repo variable is unset
        env:
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
          APPROVER_CLIENT_ID: ${{ vars.APPROVER_CLIENT_ID }}
        run: |
          for n in APPROVER_BOT APPROVER_CLIENT_ID; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APPROVER_CLIENT_ID }}
          private-key: ${{ secrets.APPROVER_APP_KEY }}
          permission-pull-requests: write
          permission-actions: read
      # main only: the label and login helper.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - id: round
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          guard() { python3 tools/agent_guard.py "$@"; }
          # Only the approver app may start a round from a review (login forms x, app/x, x[bot] are the same).
          if [ "$EVENT" = pull_request_review ] && ! guard same "$REVIEWER" "$APPROVER_BOT"; then
            echo "Review not by the approver app"; exit 0
          fi
          limit() {
            # First limit of an issue: restart the task once (restart:1) and close this PR. Second: needs-human,
            # review request to Daniel (unless author) and the German note, see tools/restart.py.
            # Never silent: if the hand-over fails, the PR still gets needs-human (the status run picks up the rest).
            python3 tools/restart.py limit "$pr" || guard label pr "$pr" needs-human
            echo "fix=false" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" = pull_request_review ]; then
            pr="$REVIEW_PR"; branch="$REVIEW_BRANCH"
            # A merged or closed PR has no branch to check out any more (#311): no fix round.
            if [ "$(gh pr view "$pr" --json state --jq .state)" != OPEN ]; then
              echo "PR $pr is not open: no fix round"
              echo "fix=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$REVIEW_STATE" = approved ]; then
              # The code reviewer's approval must not mask a security `changes` verdict for the same head
              # (the later review of the same app replaces the request-changes review in reviewDecision).
              head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
              if [ "$head" != "$REVIEW_COMMIT" ] || [ "$(python3 tools/approval.py security-changes "$pr")" != yes ]; then
                echo "Approval without a security 'changes' verdict for the head: no fix round"
                echo "fix=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
              if [ "$(gh run list --workflow agent-fix.yml --status in_progress --json databaseId --jq length)" -gt 1 ]; then
                echo "A fix run is already active; not starting a second one"
                echo "fix=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
          elif [ "$EVENT" = workflow_dispatch ]; then
            case "$DISPATCH_PR" in ''|*[!0-9]*) echo "Bad PR number"; echo "fix=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
            pr="$DISPATCH_PR"
            branch=$(gh pr view "$pr" --json state,headRefName,isCrossRepository \
              --jq 'select(.state == "OPEN" and (.isCrossRepository | not) and (.headRefName | startswith("agent/"))) | .headRefName')
            if [ -z "$branch" ]; then echo "Not an open agent/* PR of this repo"; echo "fix=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          else
            branch="$RUN_BRANCH"
            # Only the current head of an open PR; an older red run is obsolete.
            pr=$(gh pr list --state open --head "$branch" --json number,headRefOid \
              | jq -r --arg s "$RUN_SHA" '[.[] | select(.headRefOid == $s)] | first | .number // empty')
            if [ -z "$pr" ]; then echo "No open PR with head $RUN_SHA"; echo "fix=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"; echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # Model of the original task: sonnet if the PR or an issue it closes has model:sonnet.
          labels=",$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")'),"
          model=haiku
          case "$labels" in *,model:sonnet,*) model=sonnet ;; esac
          body=$(gh pr view "$pr" --json body --jq .body)
          for n in $(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' <<< "$body" | grep -oE '[0-9]+' || true); do
            ilabels=",$(gh issue view "$n" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || true),"
            case "$ilabels" in *,model:sonnet,*) model=sonnet ;; esac
          done
          # A red CI on a PR that touches the agent rules or CI tooling always gets sonnet.
          if [ "$EVENT" = workflow_run ]; then
            files=$(gh pr view "$pr" --json files --jq '.files[].path')
            if grep -qE '^(\.github/|tools/)' <<< "$files"; then model=sonnet; fi
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          case "$labels" in *,needs-human,*) echo "fix=false" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          if [ "$EVENT" = workflow_run ]; then
            # A red CI caused by PR form or VERSION/CHANGELOG is no finding on the diff: the first one per PR gets a
            # fix run without a round (label formfix); a second one counts a round like any red CI, so it cannot loop.
            # An unreadable log counts as a round, as before.
            if guard form-failure "$RUN_ID"; then
              case "$labels" in
                *,formfix,*) echo "Second form red CI on this PR: counts a round" ;;
                *)
                  guard label pr "$pr" formfix
                  echo "Red CI from PR form or VERSION/CHANGELOG: fix run without a round"
                  echo "fix=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
            fi
            # Any other red CI is a round: bump the counter like the reviewer does.
            case "$labels" in
              *,review:3,*) limit; exit 0 ;;
              *,review:2,*) guard label pr "$pr" review:3; limit; exit 0 ;;
              *,review:1,*) guard label pr "$pr" review:2 ;;
              *) guard label pr "$pr" review:1 ;;
            esac
            echo "fix=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "fix=true" >> "$GITHUB_OUTPUT"  # conflict with main: no round
          else
            # The reviewer already bumped the counter before reviewing.
            case "$labels" in
              *,review:3,*) limit ;;
              *,review:1,*|*,review:2,*) echo "fix=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "fix=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
  fix:
    needs: prepare
    if: needs.prepare.outputs.fix == 'true'
    concurrency:
      group: agent-fix-${{ needs.prepare.outputs.branch }}
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      EVENT: ${{ github.event_name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      PR: ${{ needs.prepare.outputs.pr }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      MODEL: ${{ needs.prepare.outputs.model }}
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
        run: |
          for n in AUTHOR_CLIENT_ID AUTHOR_BOT APPROVER_BOT; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          # No `workflows` and no `actions` scope: GitHub refuses a push that changes .github/workflows/ (design 0017, step 3).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # The PR can be merged (branch deleted) between `prepare` and here (#311): then there is nothing to fix.
      - id: open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh pr view "$PR" --json state --jq .state)" = OPEN ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR $PR is no longer open: no fix round"; echo "open=false" >> "$GITHUB_OUTPUT"
          fi
      # Reads the failed CI log and triggers CI: both need `actions`, which the model token no longer has. This short-lived token
      # is used by these script steps only, never by the model step.
      - id: ci-app
        if: steps.open.outputs.open == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-actions: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] this job pushes with the app token persisted by checkout
        if: steps.open.outputs.open == 'true'
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0
      - id: before
        if: steps.open.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Nothing from an earlier run may be applied to this PR: remove the agent's body file before the agent runs.
          # It lives in the checkout (the agent may not touch $RUNNER_TEMP, #266) and is kept out of git.
          rm -rf .agent-out && mkdir .agent-out && echo ".agent-out/" >> .git/info/exclude
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/body-before.txt"
      - name: Git identity
        if: steps.open.outputs.open == 'true'
        run: |
          git config user.name "Daniel"
          git config user.email "476059+Bankaifan@users.noreply.github.com"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.open.outputs.open == 'true'
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.x' }}
      - name: Install pinned CI tools (ruff, pytest, actionlint, zizmor)
        if: steps.open.outputs.open == 'true'
        env:
          EXTRA_INSTALL: ${{ vars.EXTRA_INSTALL }}
        run: bash tools/ci/install_tools.sh
      # A large `gh run view --log-failed` output lands in a tool-results file the agent may not read, and pipes are
      # denied; so the failing lines are fetched here into the checkout (git-ignored) and the agent reads that file.
      - name: Fetch the failed CI log
        if: steps.open.outputs.open == 'true' && env.EVENT == 'workflow_run'
        env:
          GH_TOKEN: ${{ steps.ci-app.outputs.token }}
        run: |
          gh run view "$RUN_ID" --log-failed | tail -n 400 > ci-failure.log || echo "log not available" > ci-failure.log
      - id: claude
        if: steps.open.outputs.open == 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: "476059"
          bot_name: "Bankaifan"
          allowed_bots: ${{ vars.AUTHOR_BOT }},${{ vars.APPROVER_BOT }}
          prompt: |
            Act as the developer described in .agents/roles/developer.md and follow AGENTS.md.
            PR #${{ env.PR }} in ${{ github.repository }} (branch ${{ env.BRANCH }}, already checked out) needs a fix.
            Trigger: ${{ env.EVENT }}.
            - pull_request_review: a review requests changes. Read it with `gh pr view ${{ env.PR }} --comments --json reviews,comments`.
            - workflow_dispatch: the PR conflicts with main. Rebase the branch onto current origin/main, resolve
              the conflicts keeping the intent of the PR (rebase, never merge main into the branch).
            - workflow_run: the validate run ${{ env.RUN_ID }} failed. Its failing lines are in `ci-failure.log`
              (read it with Read; never commit it). CI tests the PR merged with current main: rebase onto
              origin/main first, then reproduce with `make check`.
            Fix exactly what is raised, run `make check` and the tests, then squash the branch into ONE commit
            authored by Daniel (no Co-authored-by) on top of current origin/main and `git push --force-with-lease`.
            No tool or AI attribution in commits, PR bodies or comments (no "Generated with", session link, Co-Authored-By, Claude-Session).
            The tools for `make check` (and the test dependencies) are already installed: run plain `make check`,
            never `pip install`. Use one simple command per Bash call (a pipe may end in head, tail, grep, sort, wc or jq); no `&&`, `;`, `$(...)` or redirects
            (they do not match the allow list and are denied).
            Changes under .github/workflows/ are allowed: commit them like any file. After your run a script carries them
            past the token as a patch file (workflow-apply applies it after the security review). Older comments saying a
            workflow push was refused or that Daniel applies it by hand are outdated: implement and commit anyway.
            Use Read/Glob/Grep to read files, not shell reads. If a needed action is denied,
            comment on the issue/PR saying which one instead of stopping silently.
            If the review only asks for a change of the PR body (title or body text, e.g. `Closes #N` -> `Refs #N`),
            write the complete new body (max 5 lines, ASCII, no Closes/Fixes/Resolves keywords) to .agent-out/pr-body.md
            and do not run `gh pr edit` yourself: a fixed step after you applies that file to PR #${{ env.PR }}. Never change labels.
            Do not open a new PR.
          # DEV_SHELL=free (repo variable, design 0017 step 6) gives bare Bash; unset keeps the command list below.
          claude_args: >-
            --model ${{ env.MODEL }}
            --max-turns 60
            --setting-sources user
            --settings .github/claude-judge-settings.json
            --allowedTools "Read,Edit,Write,Glob,Grep,${{ vars.DEV_SHELL == 'free' && 'Bash' || 'Bash(git:*),Bash(cp:*),Bash(mkdir:*),Bash(diff:*),Bash(cmp:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(sort:*),Bash(jq:*),Bash(ls:*),Bash(make:*),Bash(bash tools/check/check_drift.sh),Bash(python3:*),Bash(pytest:*),Bash(ruff:*),Bash(actionlint:*),Bash(zizmor:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh run view:*),Bash(gh release view:*),Bash(gh release list:*)' }}"
      # Deterministic, fixed flags: the agent only writes the file, it never runs `gh pr edit`.
      # Only after a successful agent run. The file must be a regular file (no symlink) and pass the checks below.
      - name: Apply the PR body the agent wrote
        if: ${{ !cancelled() && steps.open.outputs.open == 'true' && steps.claude.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BODY_FILE: .agent-out/pr-body.md
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          f="$BODY_FILE"
          # The checkout is agent-writable: a symlinked directory or file could point at any runner file.
          if [ -L .agent-out ] || [ ! -f "$f" ] || [ -L "$f" ]; then echo "No PR body file from the agent; PR body unchanged"; exit 0; fi
          if [ "$(realpath "$f")" != "$(pwd -P)/.agent-out/pr-body.md" ]; then echo "::error::PR body file resolves outside .agent-out; not applied"; exit 1; fi
          size=$(wc -c < "$f"); lines=$(grep -c '' "$f" || true)
          if [ "$size" -lt 1 ] || [ "$size" -gt 4000 ] || [ "$lines" -gt 5 ]; then
            echo "::error::PR body is empty, over 4000 bytes or over 5 lines; not applied"; exit 1
          fi
          if LC_ALL=C grep -q '[^[:print:]]' "$f"; then echo "::error::PR body must be plain ASCII; not applied"; exit 1; fi
          # The agent may edit the checkout: use the shared closing-keyword pattern as it is on the default branch.
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/form"
          git archive FETCH_HEAD tools/check | tar -x -C "$RUNNER_TEMP/form"
          rc=0
          python3 "$RUNNER_TEMP/form/tools/check/check_pr_form.py" closing "$f" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::PR body must not contain a closing keyword (Closes/Fixes/Resolves #N, owner/repo#N or issue URL); use Refs #N; not applied"; exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::closing-keyword check failed with exit code $rc (error, not 'no match'); PR body not applied"; exit 1
          fi
          if grep -qE 'gh[pousr]_[A-Za-z0-9]{16,}|github_pat_|AKIA[0-9A-Z]{16}|-----BEGIN' "$f"; then
            echo "::error::PR body looks like it contains a secret; not applied"; exit 1
          fi
          gh pr edit "$PR" --body-file "$f"
      # git runs here, without the guard key: the agent may have planted hooks or config in the checkout.
      - name: Fetch guard tools (no key)
        if: ${{ always() && steps.open.outputs.open == 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The agent may edit the checkout: run the helpers as they are on the default branch.
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/guard"
          git archive FETCH_HEAD tools | tar -x -C "$RUNNER_TEMP/guard"
      # A push that changes .github/workflows/ is refused (no `workflows` scope on the model token): the workflow changes
      # travel as .agents/workflow-patches/<issue>.patch and workflow-apply.yml applies them after the security review.
      - name: Carry workflow changes as a patch
        if: ${{ always() && steps.open.outputs.open == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          out=$(python3 "$RUNNER_TEMP/guard/tools/workflow_patch.py" stash "$BRANCH")
          if [ -n "$out" ]; then
            gh pr comment "$PR" --body "Workflow changes of this fix travel as a patch file; workflow-apply applies them after the security review."
          fi
      # Deterministic, inline on purpose: the agent may edit files in the checkout, never this step.
      - name: Find the CI trigger inputs
        id: ci-in
        if: ${{ !cancelled() && steps.open.outputs.open == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: echo "sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"
      - name: Make sure CI runs on the PR head
        id: ci
        if: ${{ !cancelled() && steps.open.outputs.open == 'true' }}
        env:
          GH_TOKEN: ${{ steps.ci-app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.ci-in.outputs.sha }}
        run: |
          for _ in 1 2 3 4 5 6; do
            n=$(gh run list --workflow validate.yml --commit "$SHA" --json databaseId --jq length)
            if [ "$n" -gt 0 ]; then echo "validate already runs for $SHA"; exit 0; fi
            sleep 10
          done
          gh workflow run validate.yml --ref "$BRANCH"
          echo "triggered=true" >> "$GITHUB_OUTPUT"
      - name: Label the PR for review
        if: ${{ steps.open.outputs.open == 'true' && steps.ci.outputs.triggered == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 "$RUNNER_TEMP/guard/tools/agent_guard.py" label pr "$PR" agent:review
      # Never end silently: no new commit on the PR head means a comment, needs-human and Daniel's review.
      - name: Escalate a run that pushed no fix
        if: ${{ always() && steps.open.outputs.open == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          HEAD_BEFORE: ${{ steps.before.outputs.sha }}
          GUARD_KEY: ${{ secrets.GUARD_KEY }}  # script step only, never a model step (tests/test_guard_mark.py)
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}  # without it the note can never offer a restart (#624)
        run: |
          # Rule: the guard comes from main, this call from the PR branch. `silent` ignores extra trailing args and a
          # usage error escalates ("guard error"); only ever append args, never reorder or remove them.
          python3 "$RUNNER_TEMP/guard/tools/agent_guard.py" silent fix "$PR" "$HEAD_BEFORE" "$RUNNER_TEMP/body-before.txt"
