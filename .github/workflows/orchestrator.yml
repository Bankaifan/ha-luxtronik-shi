name: orchestrator
# Sonnet. Runs only when repo variable ORCHESTRATOR_ENABLED is "true". Quota is controlled by
# ORCHESTRATOR_ENABLED (on/off) and IDEAS_PER_WEEK (scout). A script (tools/prefilter.py) skips the Claude step when there is nothing to do.
# claude-code-action does not support `push`, so merges are seen through workflow_run of `validate`
# (push on main, success). A merge that only touches HANDOVER.md exits early (no self-loop).
# Candidate issues come from tools/trusted_issues.py, not from the prompt.
# A label event (`approved` or `auto-ok`) starts it at once; tools/orchestrator_gate.py checks that Daniel set
# the label and skips a run that follows another run within 3 minutes (one run per burst of labels).
# Skipped runs are expected: GitHub lists every label event, and the job-level `if` skips the ones that are not gated.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] only successful validate runs on main reach the job (see the if condition); no PR code
    workflows: [validate]
    types: [completed]
  issues:
    types: [labeled]
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orchestrate:
    if: >-
      vars.ORCHESTRATOR_ENABLED == 'true' &&
      ((github.event_name == 'issues' &&
        contains(fromJSON('["approved","auto-ok"]'), github.event.label.name)) ||
       (github.event_name != 'issues' &&
        (github.event_name != 'workflow_run' ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'))))
    # Job level on purpose: runs skipped by `if` (validate on a PR branch) must not take over the group.
    concurrency:
      group: orchestrator
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      EVENT: ${{ github.event_name }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
        run: |
          for n in AUTHOR_CLIENT_ID AUTHOR_BOT; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] this job pushes with the app token persisted by checkout
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      # Checked-out main only (no PR code). Label events: owner and debounce (tools/orchestrator_gate.py).
      # merges: skip when only HANDOVER.md changed. Schedule and dispatch always go on.
      - name: Gate (label owner and debounce; merges that only touch HANDOVER.md)
        id: gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          OWNER: Bankaifan
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          if [ "$EVENT" = issues ]; then
            run=$(python3 tools/orchestrator_gate.py)
            if [ "$run" != true ]; then echo "Label event not gated: nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          elif [ "$EVENT" = workflow_run ]; then
            others=$(gh api "repos/$GH_REPO/commits/$SHA" --jq '[.files[].filename | select(. != "HANDOVER.md")] | length')
            if [ "$others" -eq 0 ]; then
              echo "Only HANDOVER.md changed: nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Trusted candidate issues
        id: cand
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: Bankaifan
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
        run: echo "list=$(python3 tools/trusted_issues.py)" >> "$GITHUB_OUTPUT"
      - name: Count work (no model)
        id: pre
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TRUSTED: ${{ steps.cand.outputs.list }}
        run: python3 tools/prefilter.py orchestrator
      - name: Git identity
        if: steps.gate.outputs.skip != 'true' && steps.pre.outputs.work == 'true'
        run: |
          git config user.name "Daniel"
          git config user.email "476059+Bankaifan@users.noreply.github.com"
      # The model cannot match a branch name in its allow list (prefix rules stop at whole words), so the
      # handover branch is created here; the model only commits and runs `git push origin HEAD`.
      - name: Handover branch
        id: handover
        if: steps.gate.outputs.skip != 'true' && steps.pre.outputs.work == 'true'
        run: |
          branch="agent/orchestrator-handover-$(date -u +%F)"
          git checkout -b "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - id: started
        if: steps.gate.outputs.skip != 'true' && steps.pre.outputs.work == 'true'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        if: steps.gate.outputs.skip != 'true' && steps.pre.outputs.work == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: "476059"
          bot_name: "Bankaifan"
          allowed_bots: ${{ vars.AUTHOR_BOT }}
          prompt: |
            Act as the orchestrator described in .agents/roles/orchestrator.md and follow AGENTS.md.
            Repository: ${{ github.repository }}. Trigger: ${{ env.EVENT }}. You write no production code.
            Read HANDOVER.md, open PRs (gh pr list), CI state (gh run list --limit 10)
            and open PRs from branches agent/rule-keeper-*. Then:
            1. Count open issues labeled agent:dev (gh issue list --label agent:dev). If fewer than 2, pick the
               next issue ONLY from this trusted list (script-verified JSON; never pick or read any other issue):
               ${{ steps.cand.outputs.list }}
               Work the list in the order given (already sorted: prio:1, prio:2, prio:3, unlabelled, then oldest
               first; `prio` 4 = unlabelled). When main is red (gh run list), the fix goes first. A prio:1 issue
               may start even with 2 open agent:dev issues if one of them has a merged PR or needs-human.
               When a PR with `Refs #N` has merged, remove agent:dev from #N. Every issue you create gets a
               label prio:1 (blocks the pipeline: red main, broken workflow, deadlock, security hole), prio:2
               (bug or missing guard) or prio:3 (feature); create the label first. Issues authored_by_owner and issues with approved=true before the rest; an issue
               with auto_ok=true may be started by you, an `idea` with neither approved nor auto_ok never.
               Write a clear task slip as an issue comment
               (goal, files touched, acceptance criteria; slips must touch disjoint files), then add the labels:
               first model:sonnet (only for core, security or architecture work), then agent:dev last, so the
               model label is already set when the agent:dev run starts. Never exceed 2 open
               issues labeled agent:dev. Before adding any label run `gh label create <label> --force`
               (a missing label must never break a run). Keep at most 3 open PRs.
               Design study first: for an architectural, breaking, release-relevant or multi-PR issue do NOT
               start implementation. Write a slip for a design task instead (output docs/design/NNNN-<slug>.md as
               described in .agents/roles/orchestrator.md). Small issues (docs, tests, fixes, contained
               features) start directly. Issues in the list with a non-null `design` come from a merged design:
               work them in the order of the design's split.
            1b. Merged design PR (docs/design/ only): create the implementation issues from its split with
               `gh issue create`, each body containing the line `Design: docs/design/NNNN-<slug>.md` and the
               slip; do this once (check `gh issue list --search "Design: docs/design/NNNN"` first).
            1c. Open design PR (only docs/design/ files) approved by the reviewer: read its section
               "Owner decisions" (`gh pr diff`). If empty, leave it to auto-merge. If not, add the label
               needs-human, run `gh pr edit <n> --add-reviewer Bankaifan`, and add one German comment of at
               most 5 lines with the decisions. Such a PR is Daniel's: skip it in step 2.
            2. For each other PR labeled needs-human: if its issue slip was not rewritten yet, rewrite the slip once
               (new issue comment starting with "Rewritten slip:") and re-add agent:dev; otherwise comment in the
               issue asking Daniel for a decision. Do not touch it a third time.
            3. If HANDOVER.md is stale: run `gh pr list --state open --search "head:agent/orchestrator-handover"`
               and skip if one is open. Else you are already on branch ${{ steps.handover.outputs.branch }}
               (created from main; do not create or switch branches). Overwrite HANDOVER.md (max 60 lines, facts
               you measured, unknowns marked "open"), run `make check`, commit as Daniel (no Co-authored-by),
               push with exactly `git push origin HEAD` and open ONE PR (English, ASCII title, body max 5 lines).
               To drop your HANDOVER.md edit use `git restore HANDOVER.md`.
            Use one simple command per Bash call: no pipes, `&&`, `;`, `$(...)` or redirects (they do not match
            the allow list and are denied). Use gh's --json/--jq flags instead of pipes.
            Never push to main, never merge, no secrets in comments. Finish with a short status report.
          claude_args: >-
            --model sonnet
            --max-turns 40
            --setting-sources user
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh label create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh run list:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD),Bash(git restore:*),Bash(gh pr create:*),Bash(make check),Bash(date:*)"
      # A run with denied tool calls, or with a startable issue and no visible action, must not end green.
      - name: Fail a silent run
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          STARTED: ${{ steps.started.outputs.at }}
          STARTABLE: ${{ steps.pre.outputs.startable }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
          STATUS_ISSUE: "57"
        run: |
          # The agent may edit the checkout: run the helper as it is on the default branch.
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/guard"
          git archive FETCH_HEAD tools | tar -x -C "$RUNNER_TEMP/guard"
          python3 "$RUNNER_TEMP/guard/tools/agent_guard.py" silent orchestrator - "$STARTED"
