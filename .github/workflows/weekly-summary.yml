name: weekly-summary
# No model: a script updates the issue "Weekly summary" on Mondays.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-summary
  cancel-in-progress: false
jobs:
  summary:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
        run: |
          for n in AUTHOR_CLIENT_ID; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update the Weekly summary issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GUARD_KEY: ${{ secrets.GUARD_KEY }}  # verifies the failure issues; script step only, never a model step
          # same defaults as orchestrator.yml (queue section and proposal thresholds); read-only use
          MAX_DEV: ${{ vars.MAX_DEV || '4' }}
          MAX_PRS: ${{ vars.MAX_PRS || '5' }}
        run: python3 tools/weekly_summary.py
      - name: Open a PR for the new metrics row
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git diff --quiet -- docs/metrics.csv && exit 0
          branch="agent/metrics-$(date +%F)"
          git config user.name "Daniel"
          git config user.email "476059+Bankaifan@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/metrics.csv
          git commit -m "Add weekly metrics row"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$branch"
          gh pr create --head "$branch" --title "Add weekly metrics row" \
            --body "Weekly row for docs/metrics.csv from tools/weekly_summary.py. Not tied to an issue."
