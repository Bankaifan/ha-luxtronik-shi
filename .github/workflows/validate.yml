name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check_version.py "${{ github.ref }}"
      # A pull request that bumps the version releases it on merge: the CHANGELOG section must be dated.
      - name: Release readiness
        run: |
          version="$(python tools/check_version.py --version)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already released, no version bump in this change."
          else
            echo "v$version will be released on merge."
            python tools/check_version.py --release
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt pytest-timeout ruff
      - run: ruff check .
      - run: pytest --timeout=60
