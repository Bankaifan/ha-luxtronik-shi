name: agent-security-review
run-name: "security-review: ${{ github.event.workflow_run.display_title || github.event.workflow_run.head_branch }}"
# Separate run (sonnet, own role) for agent PRs classified infra/security by tools/ci/risk.py. It only asks whether
# anyone gains rights, a check gets weaker or untrusted input can reach a model or a token, and reports the
# status `security-review` (required by the ruleset). PRs that do not need it get that status from the `risk` workflow.
# Same gate as agent-review: validate green on a same-repo agent/* branch; checks out main, never PR code.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] validate gate only; checks out main, never PR code, and the reviewer cannot push
    workflows: [validate]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
jobs:
  security-review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: agent-security-review-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true  # a newer green head cancels the review of the superseded one
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
      APPROVER_BOT: ${{ vars.APPROVER_BOT }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fail if a required repo variable is unset
        env:
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
          APPROVER_CLIENT_ID: ${{ vars.APPROVER_CLIENT_ID }}
        run: |
          for n in APPROVER_BOT APPROVER_CLIENT_ID; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APPROVER_CLIENT_ID }}
          private-key: ${{ secrets.APPROVER_APP_KEY }}
          permission-pull-requests: write
      # main only, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Find the PR and its risk class
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          skip() { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          pr=$(gh api -X GET "repos/$GH_REPO/pulls" -f state=open -f head="${GH_REPO%%/*}:$BRANCH" \
            | jq -c --arg s "$SHA" '[.[] | select(.head.sha == $s)] | first // empty')
          if [ -z "$pr" ]; then echo "No open PR with head $SHA"; skip; fi
          num=$(jq -r .number <<<"$pr")
          labels=",$(jq -r '[.labels[].name] | join(",")' <<<"$pr"),"
          python3 tools/agent_guard.py agent-pr "$(jq -r .user.login <<<"$pr")" "$labels" || { echo "Not an agent PR"; skip; }
          level=$(gh pr diff "$num" | python3 tools/ci/risk.py classify AGENTS.md)
          echo "Risk class: $level"
          if [ "$level" = "none" ]; then echo "No infrastructure change"; skip; fi
          # validate can go green twice for one SHA: one security review per commit.
          # Only comments of the approver app count; anyone else could post such a line.
          norm='ascii_downcase | sub("^app/";"") | sub("\\[bot\\]$";"")'
          if gh pr view "$num" --json comments | jq -r --arg a "$APPROVER_BOT" \
              ".comments[] | select((.author.login | $norm) == (\$a | $norm)) | .body" \
              | grep -q "^security-review: .* ${SHA:0:7}"; then
            echo "Already reviewed $SHA"; skip
          fi
          { echo "num=$num"; echo "level=$level"; } >> "$GITHUB_OUTPUT"
      # The change as plain files, so the reviewer reads it with Read instead of shell output that can be cut off or
      # denied (#267). tools/ci/stage_review.py (design 0010) keeps the security-relevant files in pr.diff, lists the
      # rest in skipped.txt and prints `turns=<n>` (a number computed from the diff size, never model text).
      # Data only: nothing here is run, the checkout stays main.
      - name: Stage the change as files
        id: stage
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          rm -rf .review && mkdir -p .review/files
          gh pr diff "$PR" | python3 tools/ci/stage_review.py .review >> "$GITHUB_OUTPUT"
          wc -l .review/pr.diff .review/skipped.txt
      - id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: ${{ vars.AUTHOR_BOT }}
          prompt: |
            Act as the security reviewer described in .agents/roles/security-reviewer.md and follow AGENTS.md.
            Review PR #${{ steps.pr.outputs.num }} in ${{ github.repository }} at commit ${{ env.SHA }} (risk class: ${{ steps.pr.outputs.level }}).
            The checkout is main, not the PR: never run or import code from the PR. The change is staged as files:
            `.review/pr.diff` (the diff of the security-relevant files), `.review/skipped.txt` (the other changed paths
            with status and +/- counts, left out of the diff) and `.review/files/<path>` (a staged file at the PR head).
            Read them with Read (long files in parts with offset/limit); open a skipped path with `gh pr diff` only if
            its name makes it relevant. Use `gh pr view` for the body and `gh issue view` for the linked issue.
            If you could not read the change, give no verdict line at all (the run then fails and can be re-run);
            `changes` is only for findings in the code.
            Do not post anything yourself: end your final reply with your verdict, whose first line is exactly
            `security-review: approve ${{ env.SHA }}` or `security-review: changes ${{ env.SHA }}`, followed by the
            reasons (file, line). A script posts it as the PR comment. Do not post a note for Daniel (a script does).
          claude_args: >-
            --model sonnet
            --max-turns ${{ steps.stage.outputs.turns }}
            --setting-sources user
            --settings .github/claude-judge-settings.json
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
      # The model has no write or comment tools: a script posts the verdict from its final reply. `changes` also gets a
      # request-changes review by the approver app, which starts a normal agent-fix round. No verdict: denials are logged.
      - name: Post the verdict
        if: ${{ !cancelled() && steps.claude.conclusion != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.num }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 tools/ci/post_verdict.py "$PR" "$SHA"
      # A run that left no verdict fails the required status instead of ending silently.
      - name: Publish status security-review
        if: ${{ !cancelled() && steps.claude.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.num }}
        run: python3 tools/ci/risk.py verdict "$PR" "$SHA"
      # Whichever of agent-review / agent-security-review finishes last marks the PR for Daniel (idempotent).
      - name: Mark an approved PR that waits for Daniel
        if: ${{ !cancelled() && steps.claude.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.num }}
        run: python3 tools/ci/risk.py wait "$PR" "$SHA"
