name: train
# No model: tools/train.py rebases the oldest approved agent PR that is BEHIND main and starts the conflict fix round
# (design docs/design/0003-merge-train.md, 4.3). Runs right after every push to main, right after a review run ends
# (a PR that was just approved while behind main is rebased at once, not at the next half hour), every 30 min as a
# fallback, and by hand.
# Two or more ready PRs land as one batch PR on agent/batch (decision 0018; TRAIN_BATCH=off keeps the serial train).
# Repo variable TRAIN=off disables it. Checkout is main only; PR data is read through gh as data, never executed.
on:
  push:
    branches: [main]
  workflow_run:  # zizmor: ignore[dangerous-triggers] only the fact that a review run ended is used; the checkout is main, PR code is never checked out or run
    workflows: [agent-review, agent-security-review]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: train
  cancel-in-progress: false
jobs:
  train:
    if: >-
      (vars.TRAIN || 'on') != 'off' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
        run: |
          for n in AUTHOR_CLIENT_ID AUTHOR_BOT APPROVER_BOT; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      # Author app token, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not start validate.
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write
      - name: Rebase the next PR and start conflict fixes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ vars.OWNER || github.repository_owner }}
          OWNER_LANG: ${{ vars.OWNER_LANG || 'German' }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
          APPROVER_BOT: ${{ vars.APPROVER_BOT }}
          TRAIN_BATCH: ${{ vars.TRAIN_BATCH || 'on' }}
        run: python3 tools/train.py
