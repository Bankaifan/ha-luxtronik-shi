name: rule-keeper
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Model (haiku by default; sonnet only on purpose, like model:sonnet)"
        type: choice
        options: [haiku, sonnet]
        default: haiku
permissions:
  contents: read
concurrency:
  group: rule-keeper
  cancel-in-progress: false
jobs:
  keep:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      MODEL: ${{ inputs.model || 'haiku' }}
    steps:
      - name: Fail if a required repo variable is unset
        env:
          AUTHOR_CLIENT_ID: ${{ vars.AUTHOR_CLIENT_ID }}
          AUTHOR_BOT: ${{ vars.AUTHOR_BOT }}
        run: |
          for n in AUTHOR_CLIENT_ID AUTHOR_BOT; do
            [ -n "${!n}" ] || { echo "::error::Repo variable $n is not set (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
          done
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTHOR_CLIENT_ID }}
          private-key: ${{ secrets.AUTHOR_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] this job pushes with the app token persisted by checkout
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: Propose a tier change (script, never switches the tier)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/tier.py --propose
      - name: Git identity
        run: |
          git config user.name "Daniel"
          git config user.email "476059+Bankaifan@users.noreply.github.com"
      # The model is denied `git checkout -b` (issue #203): the script creates the branch, the model only edits, commits, pushes.
      - name: Rule-keeper branch
        id: branch
        run: |
          branch="agent/rule-keeper-$(date +%F)"
          git checkout -b "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          bot_id: "476059"
          bot_name: "Bankaifan"
          allowed_bots: ${{ vars.AUTHOR_BOT }}
          prompt: |
            You are the rule keeper of ${{ github.repository }}. Read AGENTS.md, .agents/roles/*.md, tools/check/,
            the last 30 merged PRs with reviews and comments (gh pr list --state merged --limit 30; gh pr view --comments)
            and all PRs labeled needs-human. Look for:
            1. rules a script could check (propose the script in tools/check/, remove the rule text),
            2. rules that never mattered (propose removal),
            3. repeated failures where a rule was missing,
            4. contradictions between AGENTS.md, role files and CI,
            5. recurring work steps of agent runs: fixed command sequences or decisions without judgement that every run
            repeats (counting and setting labels, round counters, the same gh queries, fixed-format texts). Evidence:
            the PRs above, the agent workflow files in .github/workflows/. The run logs are not readable with your tools
            (the execution files sit in the runner temp dir, which is denied): do not try to fetch them and do not guess
            counts; write "open" where a number is unknown. For each step, propose a script in tools/ (wired into the
            workflow before or instead of the model step) with the runs per week it affects. Template-managed files are
            not edited here; name them in the PR body.
            If nothing is worth changing, do nothing. Otherwise first run `gh pr list --state open --search "head:agent/rule-keeper-"`
            and stop if one is open. The workflow already created the branch `${{ steps.branch.outputs.branch }}` from main and
            checked it out: make the edits on it (do not create, switch or check out branches yourself), run `make check`,
            commit, run `git push origin HEAD` and open ONE PR (English, ASCII title, body max 5 lines) with a reason per change.
            Never edit main directly, never merge. Daniel merges.
            Finish with the required last line `Conclusion: <one sentence: what you found or why you did nothing>`.
          claude_args: >-
            --model ${{ env.MODEL }}
            --max-turns 30
            --setting-sources user
            --settings .github/claude-judge-settings.json
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD),Bash(git status:*),Bash(git diff:*),Bash(gh pr create:*),Bash(make:*),Bash(date:*),Bash(wc:*),Bash(ls:*),Bash(rm:*)"
      - name: Run report (script, no model)
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          MODEL: ${{ env.MODEL }}
          WORKFLOW_FILE: .github/workflows/rule-keeper.yml
          GUARD_KEY: ${{ secrets.GUARD_KEY }}  # script step only, never a model step (tests/test_guard_mark.py)
        run: |
          # The agent may edit the checkout: run the helper as it is on the default branch.
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          mkdir -p "$RUNNER_TEMP/guard"
          git archive FETCH_HEAD tools | tar -x -C "$RUNNER_TEMP/guard"
          python3 "$RUNNER_TEMP/guard/tools/run_report.py" rule-keeper
