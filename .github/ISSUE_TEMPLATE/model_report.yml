name: Supported model report
description: Report which controller and equipment you use and what works with this integration.
body:
  - type: markdown
    attributes:
      value: |
        Use this form to tell us about a heat pump controller that works (or does not work) with the integration.
        Only the Smart Home Interface (SHI, Modbus/TCP) is supported.
  - type: input
    id: controller_model
    attributes:
      label: Controller model
      description: The model printed on the controller, e.g. alpha innotec LWDV 91-1/3.
      placeholder: "alpha innotec LWDV 91-1/3"
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: Firmware version
      description: The firmware version of the controller.
      placeholder: "3.92.3"
    validations:
      required: true
  - type: checkboxes
    id: equipment
    attributes:
      label: Equipment
      description: Select everything that is installed on your heat pump system.
      options:
        - label: Mixing circuit(s)
        - label: Cooling
        - label: Pool
        - label: Room unit
  - type: textarea
    id: equipment_details
    attributes:
      label: Equipment details
      description: Number of mixing circuits, any further equipment that is not in the list above, and anything else relevant.
      placeholder: "e.g. two mixing circuits, no cooling"
    validations:
      required: false
  - type: textarea
    id: works
    attributes:
      label: What works
      description: Which entities and functions work? Name the entities or the features you tested.
      placeholder: |
        - Temperatures (flow, return, outside)
        - Heating setpoint
        - ...
    validations:
      required: true
  - type: textarea
    id: does_not_work
    attributes:
      label: What does not work
      description: Which entities are missing, wrong or unavailable? Describe what you observed.
      placeholder: |
        - ...
    validations:
      required: true
