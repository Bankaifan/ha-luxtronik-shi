name: Bug report
description: Something in the integration does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can.
        The integration writes to a heating system, so please do not guess values you have not seen.
  - type: input
    id: controller_model
    attributes:
      label: Controller model
      description: The model printed on the controller, e.g. alpha innotec LWDV 91-1/3.
      placeholder: "alpha innotec LWDV 91-1/3"
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: Firmware version
      description: The firmware version shown on the controller or in the device information.
      placeholder: "3.92.3"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: "2026.x.y"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: The version in `custom_components/luxtronik_shi/manifest.json` or shown in HACS.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      description: |
        Not available yet. This field is a placeholder for the diagnostics download that will come later.
        For now, leave it empty or write "none".
      placeholder: "none"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order, to trigger the problem?
      placeholder: |
        1. Open the heat pump device page
        2. Change the heating setpoint to ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include error messages from the Home Assistant log if there are any.
    validations:
      required: true
